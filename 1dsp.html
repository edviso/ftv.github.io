<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Local - DeepSeek</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 15px; 
            background-color: #f0f2f5; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            box-sizing: border-box; 
        }
        #config-panel { 
            margin-bottom: 10px; 
            padding: 12px; 
            background: white; 
            border-radius: 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        input[type="password"], select { 
            width: 100%; 
            padding: 8px; 
            margin-top: 6px; 
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box; 
        }
        input[type="password"] { font-family: monospace; }
        select { font-size: 14px; cursor: pointer; }
        
        #chat-container { 
            flex: 1; 
            background: white; 
            border-radius: 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            margin-bottom: 10px;
        }
        #messages { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .message { 
            padding: 12px 16px; 
            border-radius: 15px; 
            max-width: 85%; 
            line-height: 1.5; 
            word-wrap: break-word;
            white-space: pre-wrap; /* Mantiene los saltos de línea */
        }
        .user-message { 
            background: #0b93f6; 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 4px; 
        }
        .bot-message { 
            background: #e5e5ea; 
            color: black; 
            align-self: flex-start; 
            border-bottom-left-radius: 4px; 
        }
        
        /* Área de escritura amplia y cómoda */
        #input-area { 
            display: flex; 
            flex-direction: column;
            padding: 12px; 
            background: #fff; 
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            gap: 8px;
        }
        #user-input { 
            width: 100%; 
            height: 110px; /* Ocupa buen espacio vertical en el celular */
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            outline: none; 
            font-size: 15px;
            font-family: inherit;
            resize: vertical; /* Permite estirarlo aún más si lo deseas */
            box-sizing: border-box;
        }
        .button-group {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        #send-btn { 
            padding: 10px 20px; 
            background: #0b93f6; 
            color: white; 
            font-weight: bold;
            border: none; 
            border-radius: 20px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        #send-btn:hover { background: #0077ce; }
        #send-btn:disabled { background: #b0c4de; cursor: not-allowed; }
        
        #copy-btn {
            padding: 10px 15px; 
            background: #28a745; 
            color: white; 
            font-weight: bold;
            border: none; 
            border-radius: 20px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        #copy-btn:hover { background: #218838; }
    </style>
</head>
<body>

<div id="config-panel">
    <label for="api-key"><small><strong>🔑 API Key de DeepSeek:</strong></small></label>
    <input type="password" id="api-key" placeholder="Pega aquí tu key (empieza con sk-...)" />
    
    <label for="model-selector" style="display:block; margin-top:8px;"><small><strong>🧠 Selecciona el Modelo:</strong></small></label>
    <select id="model-selector">
        <option value="deepseek-chat">⚡ V4 Flash (Rápido y económico)</option>
        <option value="deepseek-reasoner">🔬 V4 Pro (Análisis profundo de tuestes)</option>
    </select>
</div>

<div id="chat-container">
    <div id="messages">
        <div class="message bot-message">¡Hola! Escribe o pega tu texto y tablas aquí abajo con total comodidad.</div>
    </div>
</div>

<div id="input-area">
    <textarea id="user-input" placeholder="Escribe tu mensaje o pega tu JSON/datos de tueste aquí... (Enter hace saltos de línea)"></textarea>
    <div class="button-group">
        <button id="copy-btn" title="Copiar historial al portapapeles">📋 Copiar Chat</button>
        <button id="send-btn">Enviar</button>
    </div>
</div>

<script>
    const apiKeyInput = document.getElementById('api-key');
    const modelSelector = document.getElementById('model-selector');
    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const copyBtn = document.getElementById('copy-btn');

    let conversationHistory = [
        { role: "system", content: "Eres un asistente experto. Si se te piden análisis complejos, razona paso a paso." }
    ];

    if (localStorage.getItem('deepseek_key')) {
        apiKeyInput.value = localStorage.getItem('deepseek_key');
    }
    
    if (localStorage.getItem('deepseek_model')) {
        modelSelector.value = localStorage.getItem('deepseek_model');
    }

    apiKeyInput.addEventListener('input', () => {
        localStorage.setItem('deepseek_key', apiKeyInput.value.trim());
    });
    
    modelSelector.addEventListener('change', () => {
        localStorage.setItem('deepseek_model', modelSelector.value);
    });

    function addMessage(role, content) {
        const div = document.createElement('div');
        div.className = `message ${role === 'user' ? 'user-message' : 'bot-message'}`;
        div.textContent = content;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        const apiKey = apiKeyInput.value.trim();
        const selectedModel = modelSelector.value;

        if (!text) return;
        if (!apiKey) {
            alert("⚠️ Por favor, ingresa tu API Key en la parte superior.");
            apiKeyInput.focus();
            return;
        }

        addMessage('user', text);
        conversationHistory.push({ role: "user", content: text });
        
        userInput.value = '';
        sendBtn.disabled = true;
        sendBtn.textContent = 'Pensando...';

        try {
            const response = await fetch('https://api.deepseek.com/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: selectedModel,
                    messages: conversationHistory
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || `Error HTTP: ${response.status}`);
            }

            const data = await response.json();
            const botReply = data.choices[0].message.content;

            addMessage('assistant', botReply);
            conversationHistory.push({ role: "assistant", content: botReply });

        } catch (error) {
            console.error(error);
            addMessage('assistant', "❌ Error de conexión: " + error.message);
            conversationHistory.pop(); 
        } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = 'Enviar';
            userInput.focus();
        }
    }

    copyBtn.addEventListener('click', async () => {
        if (conversationHistory.length <= 1) {
            alert("Todavía no hay mensajes para copiar.");
            return;
        }

        let chatText = "--- Historial de Chat ---\n\n";
        for (let i = 1; i < conversationHistory.length; i++) {
            const msg = conversationHistory[i];
            const sender = msg.role === 'user' ? 'Tú' : 'DeepSeek';
            chatText += `${sender}:\n${msg.content}\n\n`;
        }

        try {
            await navigator.clipboard.writeText(chatText.trim());
            const originalText = copyBtn.textContent;
            copyBtn.textContent = '✔️ ¡Copiado!';
            copyBtn.style.background = '#218838';
            setTimeout(() => {
                copyBtn.textContent = originalText;
                copyBtn.style.background = '#28a745';
            }, 2000);
        } catch (err) {
            console.error('Error al copiar: ', err);
            alert("No se pudo copiar el texto.");
        }
    });

    sendBtn.addEventListener('click', sendMessage);
    
    // Como ahora es un campo grande, permitimos usar Enter para escribir párrafos. 
    // Si deseas enviar rápido con teclado físico puedes usar Ctrl+Enter.
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.ctrlKey) {
            sendMessage();
        }
    });
</script>
</body>
</html>
