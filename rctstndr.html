 {name:'Típica Lavado',source:'Propio',origin:'Quito · Ecuador · Lavado',score:'78.8',original:{device:'Origami',method:'Pour over',grind:13,dose:19,water:304,ice:0,temp:'95°C',pours:[[57,'Bloom'],[139,'V1'],[222,'V2'],[304,'V3']],time:'Registro real',note:'Mejor cata registrada de Típica lavado.'},adapt:{
   'V60':{grind:14,temp:'95°C',time:'3:00–3:40',pours:[[57,'0:00 · Bloom'],[139,'0:45'],[222,'1:25'],[304,'2:05']],tech:'Caudal medio y vertidos más espaciados por el volumen alto.',why:'Se abre 1 clic al pasar a V60 para controlar resistencia en una dosis grande de 19 g.'},
   'Origami':{grind:13,temp:'95°C',time:'Receta ganadora',pours:[[57,'Bloom'],[139,'V1'],[222,'V2'],[304,'V3']],tech:'Repetir receta real.',why:'Es la receta original; no se cambia.'},
   'AeroPress':{grind:11,temp:'94°C',time:'2:00–2:25',pours:[[57,'0:00 · Preinf.'],[220,'0:30 · Cámara'],[84,'Bypass final']],tech:'Usar 220 ml en la cámara, infusionar hasta 1:30, presionar 30 s y añadir 84 ml de bypass para llegar a 304 ml.',why:'No se intenta meter 304 ml en la cámara. La molienda solo se afina moderadamente porque 19 g y clic 13 ya forman una cama muy resistente.'},

];

const carousel=document.getElementById('carousel'), dots=document.getElementById('dots');
const states=recipes.map(()=> 'Original');
function fmt(n){if(typeof n==='string')return n; return Number.isInteger(Number(n))?String(Number(n)):String(Math.round(Number(n)*10)/10)}
function grinderEq(m){
  /*
    Calibración confirmada:
    MAVO 35 ≈ AMZCHEF 62 ≈ Timemore C3S 16.

    El MAVO sigue siendo la escala maestra de las recetas de Edgar.
    Las otras dos escalas se estiman desde ese punto común.
  */
  const mavo = Math.round(m);
  const amz = Math.max(1, Math.round(m * 62 / 35));
  const c3s = Math.max(1, Math.round(m * 16 / 35));
  return {mavo, amz, c3s};
}
function methodFor(dev){if(dev==='AeroPress')return 'Inmersión + presión'; if(dev==='Hario Switch')return 'Híbrido'; return 'Pour over'}
function getView(base,target){
  if(target==='Original')return {...base.original,why:'Receta real registrada en RoastLab.',isOriginal:true};
  const a=base.adapt[target]; return {...a,device:target,method:methodFor(target),dose:base.original.dose,water:base.original.water,ice:base.original.ice||0,isOriginal:false};
}
function poursHtml(arr){return arr.map(x=>`<div class="pour-stop"><div class="pour-dot"></div><div class="pour-ml">${fmt(x[0])}${String(x[1]).includes('Bypass')?'':'ml'}</div><div class="pour-name">${x[1]}</div></div>`).join('')}
function renderCard(base,i){
  const sel=states[i], r=getView(base,sel), eq=grinderEq(r.grind), converted=sel!=='Original';
  return `<section class="card" data-card="${i}">
    <div class="header-row"><div class="title-wrap"><div class="eyebrow">${converted?'Receta adaptada':'Mejor receta'} · ${base.source}</div><h1>${base.name}</h1><div class="subtitle">${base.origin}</div>${converted?`<div class="converted-badge">Convertida → ${sel}</div>`:''}</div>
      <div class="converter" data-converter="${i}"><button class="convert-btn" onclick="toggleMenu(${i},event)">Convertir<small>${sel}</small></button><div class="convert-menu">${['Original','V60','Origami','AeroPress','Hario Switch'].map(x=>`<button class="convert-option ${sel===x?'active':''}" onclick="setDevice(${i},'${x}',event)">${x}</button>`).join('')}</div></div>
    </div>
    <div class="tag">Método: ${r.method}</div><div class="rule"></div>
    <div class="spec-grid">
      <div><div class="spec-label">Dispositivo</div><div class="spec-value">${r.device}</div></div>
      <div><div class="spec-label">Molienda base</div><div class="spec-value">Click ${eq.mavo} <span class="unit">MAVO</span></div></div>
      <div><div class="spec-label">Dosis</div><div class="spec-value">${fmt(r.dose)} g</div></div>
      <div><div class="spec-label">Agua</div><div class="spec-value">${fmt(r.water)} ml${r.ice?`<br><span class="unit">+ ${fmt(r.ice)} ml hielo</span>`:''}</div></div>
      <div><div class="spec-label">Temperatura</div><div class="spec-value">${r.temp}</div></div>
      <div><div class="spec-label">${r.isOriginal?'Puntuación':'Base original'}</div><div class="spec-value">${base.score}</div></div>
      <div class="grinder-equivalents"><div class="grinder-title">Equivalencia aproximada de molienda</div><div class="grinder-grid">
        <div class="grinder-item"><div class="grinder-name">MAVO<br>Edgar</div><div class="grinder-click">${eq.mavo}</div></div>
        <div class="grinder-item"><div class="grinder-name">Timemore C3S<br>Adrián</div><div class="grinder-click">${eq.c3s}</div></div>
        <div class="grinder-item"><div class="grinder-name">AMZCHEF<br>Javier</div><div class="grinder-click">${eq.amz}</div></div>
      </div><div class="grinder-note">Ancla confirmada: MAVO 35 ≈ AMZCHEF 62 ≈ Timemore C3S 16. La equivalencia entre molinos es aproximada; el valor MAVO sigue siendo la referencia técnica principal.</div></div>
    </div>
    <div class="rule"></div><div class="section-title"><span class="num">1</span>Vertidos / fases</div><div class="pours-row"><div class="pours-line"></div>${poursHtml(r.pours)}</div>
    <div class="rule"></div><div class="section-title"><span class="num">2</span>${r.isOriginal?'Nota de cata / ejecución':'Técnica adaptada'}</div><div class="technique-list"><div class="t-item">${r.tech || r.note}</div></div>
    ${converted?`<div class="rationale"><b>Criterio técnico:</b> ${r.why}<div class="warning">La conversión ya no usa una suma/resta fija entre métodos. Prioriza datos reales del mismo café cuando existen, permeabilidad del lecho, tipo de extracción, temperatura y riesgo de estancamiento.</div></div>`:''}
    <div class="total-box"><div class="total-label">${r.isOriginal?'Resultado':'Tiempo objetivo'}</div><div class="total-value">${r.isOriginal?base.score:r.time}</div></div>
    <div class="footnote">${r.isOriginal?'Receta real registrada por Edgar en RoastLab.':'Adaptación técnica de punto de partida. Si el drenaje se desvía >30–40 s del objetivo, corrige primero la molienda antes de cambiar temperatura.'}</div>
  </section>`
}
function currentIndex(){return Math.round(carousel.scrollLeft/Math.max(carousel.clientWidth,1))||0}
function renderAll(){const idx=currentIndex();carousel.innerHTML=recipes.map(renderCard).join('');dots.innerHTML=recipes.map((_,i)=>`<span class="${i===idx?'active':''}"></span>`).join('');requestAnimationFrame(()=>carousel.scrollLeft=idx*carousel.clientWidth)}
window.toggleMenu=function(i,e){e.stopPropagation();document.querySelectorAll('.converter').forEach(el=>{if(el.dataset.converter!==String(i))el.classList.remove('open')});document.querySelector(`[data-converter="${i}"]`).classList.toggle('open')}
window.setDevice=function(i,d,e){e.stopPropagation();states[i]=d;renderAll()}
document.addEventListener('click',()=>document.querySelectorAll('.converter').forEach(el=>el.classList.remove('open')))
carousel.addEventListener('scroll',()=>{const idx=currentIndex();[...dots.querySelectorAll('span')].forEach((d,i)=>d.classList.toggle('active',i===idx))})
renderAll();

let wakeLock=null;const bar=document.getElementById('wakeBar'),txt=document.getElementById('wakeTxt'),btn=document.getElementById('wakeBtn');function setStatus(on,msg){bar.classList.toggle('on',on);txt.textContent=msg}async function requestWakeLock(){if(!('wakeLock'in navigator)){setStatus(false,'Wake Lock no disponible en este navegador.');btn.style.display='none';return}try{wakeLock=await navigator.wakeLock.request('screen');setStatus(true,'Pantalla activa mientras preparas');wakeLock.addEventListener('release',()=>setStatus(false,'Se liberó — toca “Reactivar”'))}catch(e){setStatus(false,location.protocol==='https:'?'No se pudo activar. Toca “Reactivar”.':'Wake Lock requiere HTTPS.')}}btn.addEventListener('click',requestWakeLock);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestWakeLock()});requestWakeLock();
</script>
</body>
