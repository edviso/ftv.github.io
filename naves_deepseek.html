<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05030d">
<title>NEÓN VOID — Arcade Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05030d;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
'use strict';

/* =========================================================
   1. CANVAS Y ESCALADO RESPONSIVO
   ========================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });

let W = 1, H = 1, DPR = 1, S = 1;

/* =========================================================
   2. CONFIGURACIÓN DE NAVES Y DIFICULTAD
   ========================================================= */
const SHIPS = [
  { name: 'FLECHA', color: '#4ff0ff', accent: '#ff4fa3' },
  { name: 'CAZA',   color: '#7dff6b', accent: '#4ff0ff' },
  { name: 'DELTA',  color: '#b46bff', accent: '#ffd24f' }
];

const DIFFICULTY = [
  { name: 'FÁCIL',  color: '#7dff6b', lives: 5, enemySpeedMul: 0.80, spawnMul: 1.30, enemyHpBonus: -1, enemyShootMul: 1.30 },
  { name: 'MEDIO',  color: '#ffd24f', lives: 3, enemySpeedMul: 1.00, spawnMul: 1.00, enemyHpBonus:  0, enemyShootMul: 1.00 },
  { name: 'DIFÍCIL',color: '#ff3f7a', lives: 2, enemySpeedMul: 1.22, spawnMul: 0.75, enemyHpBonus:  1, enemyShootMul: 0.75 }
];

let selectedShip = 0;
let selectedDiff = 1;

try {
  const s = parseInt(localStorage.getItem('neonvoid_ship') || '0', 10);
  const d = parseInt(localStorage.getItem('neonvoid_diff') || '1', 10);
  if (s >= 0 && s <= 2) selectedShip = s;
  if (d >= 0 && d <= 2) selectedDiff = d;
} catch (e) {}

function saveSettings() {
  try {
    localStorage.setItem('neonvoid_ship', String(selectedShip));
    localStorage.setItem('neonvoid_diff', String(selectedDiff));
  } catch (e) {}
}

/* =========================================================
   3. AUDIO PROCEDURAL (Web Audio API)
   ========================================================= */
let actx = null;
let masterGain = null;
let noiseBuf = null;

function initAudio() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    actx = new AC();
    masterGain = actx.createGain();
    masterGain.gain.value = 0.42;
    masterGain.connect(actx.destination);
  } catch (e) {
    actx = null;
  }
}

function unlockAudio() {
  initAudio();
  if (actx && actx.state === 'suspended') {
    actx.resume().catch(function () {});
  }
}

function getNoiseBuffer() {
  if (!actx) return null;
  if (noiseBuf) return noiseBuf;
  const len = Math.floor(actx.sampleRate * 0.9);
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  return noiseBuf;
}

function sfxShoot() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(1180, t);
  o.frequency.exponentialRampToValueAtTime(240, t + 0.085);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.075, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.10);
  o.connect(g);
  g.connect(masterGain);
  o.start(t);
  o.stop(t + 0.11);
}

function sfxExplosion(vol) {
  if (!actx) return;
  vol = (typeof vol === 'number') ? vol : 0.22;
  const t = actx.currentTime;
  const buf = getNoiseBuffer();
  if (!buf) return;
  const src = actx.createBufferSource();
  src.buffer = buf;
  const flt = actx.createBiquadFilter();
  flt.type = 'lowpass';
  flt.frequency.setValueAtTime(2200, t);
  flt.frequency.exponentialRampToValueAtTime(110, t + 0.36);
  flt.Q.value = 1.2;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
  src.connect(flt);
  flt.connect(g);
  g.connect(masterGain);
  src.start(t);
  src.stop(t + 0.45);
}

function sfxPowerup() {
  if (!actx) return;
  const t0 = actx.currentTime;
  const freqs = [523, 659, 784, 1046, 1318];
  for (let i = 0; i < freqs.length; i++) {
    const t = t0 + i * 0.055;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freqs[i], t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.11, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);
    o.connect(g);
    g.connect(masterGain);
    o.start(t);
    o.stop(t + 0.09);
  }
}

function sfxPlayerHit() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(420, t);
  o.frequency.exponentialRampToValueAtTime(60, t + 0.45);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.16, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  o.connect(g);
  g.connect(masterGain);
  o.start(t);
  o.stop(t + 0.52);
}

/* =========================================================
   4. ESTADO GLOBAL
   ========================================================= */
let state = 'menu';             // 'menu' | 'playing' | 'gameover'
let score = 0;
let level = 1;
let highScore = 0;
try {
  highScore = parseInt(localStorage.getItem('neonvoid_hs') || '0', 10) || 0;
} catch (e) { highScore = 0; }

let time = 0;
let spawnTimer = 0;
let gameOverTimer = 0;
let shakeTime = 0;
let shakeMax = 1;
let shakeMag = 0;

const player = {
  x: 0, y: 0, w: 30, h: 34,
  lives: 3,
  invuln: 0,
  shield: 0,
  triple: 0,
  speedBoost: 0,
  shootCd: 0
};

const bullets = [];
const ebullets = [];
const enemies = [];
const powerups = [];
const particles = [];
const stars = [];

/* =========================================================
   5. UTILIDADES
   ========================================================= */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

function aabb(a, b) {
  return (Math.abs(a.x - b.x) * 2 < (a.w + b.w)) &&
         (Math.abs(a.y - b.y) * 2 < (a.h + b.h));
}

function shake(mag, frames) {
  shakeMag = mag;
  shakeTime = frames;
  shakeMax = frames;
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function computeScale() {
  S = clamp(Math.min(W / 420, H / 700), 0.62, 1.9);
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);

  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  computeScale();

  player.w = 30 * S;
  player.h = 34 * S;

  if (state === 'menu' || state === 'gameover') {
    player.x = W / 2;
    player.y = H - 110 * S;
  }
  clampPlayer();

  initStars();
}

function clampPlayer() {
  const hw = player.w * 0.5;
  const hh = player.h * 0.5;
  player.x = clamp(player.x, hw + 2, W - hw - 2);
  player.y = clamp(player.y, hh + 52 * S, H - hh - 6 * S);
}

/* =========================================================
   6. FONDO ESTELAR
   ========================================================= */
function initStars() {
  stars.length = 0;
  const count = Math.min(240, Math.floor((W * H) / 7000));
  for (let i = 0; i < count; i++) {
    const z = Math.random();
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      z: z,
      size: (0.6 + z * 1.9) * Math.max(0.7, S * 0.8),
      speed: (0.35 + z * 4.2),
      alpha: 0.22 + z * 0.75
    });
  }
}

function updateStars(dt) {
  for (let i = 0; i < stars.length; i++) {
    const st = stars[i];
    st.y += st.speed * S * dt;
    if (st.y > H + 4) {
      st.y = -4;
      st.x = Math.random() * W;
    }
  }
}

function drawStars() {
  for (let i = 0; i < stars.length; i++) {
    const st = stars[i];
    if (st.z > 0.68) {
      ctx.globalAlpha = st.alpha;
      ctx.fillStyle = st.z > 0.88 ? '#bfefff' : '#7fd8ff';
      ctx.fillRect(st.x, st.y, st.size, st.size * 2.4);
    } else {
      ctx.globalAlpha = st.alpha;
      ctx.fillStyle = '#5a6ea8';
      ctx.fillRect(st.x, st.y, st.size, st.size);
    }
  }
  ctx.globalAlpha = 1;
}

/* =========================================================
   7. PARTÍCULAS
   ========================================================= */
function spawnExplosion(x, y, count, color) {
  if (particles.length > 520) return;
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = (0.5 + Math.random() * 4.6) * S;
    particles.push({
      x: x, y: y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      life: 1,
      decay: 0.014 + Math.random() * 0.032,
      size: (1 + Math.random() * 2.8) * S,
      color: color
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.965;
    p.vy *= 0.965;
    p.vy += 0.045 * S * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

/* =========================================================
   8. DISEÑO DE NAVES (primitivas canvas)
   ========================================================= */
function drawShipShape(cx, cy, w, h, style, primaryColor, accentColor) {
  ctx.save();
  ctx.translate(cx, cy);

  if (style === 0) {
    /* FLECHA */
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.55);
    ctx.lineTo(w * 0.20, -h * 0.10);
    ctx.lineTo(w * 0.52, h * 0.16);
    ctx.lineTo(w * 0.34, h * 0.40);
    ctx.lineTo(0, h * 0.26);
    ctx.lineTo(-w * 0.34, h * 0.40);
    ctx.lineTo(-w * 0.52, h * 0.16);
    ctx.lineTo(-w * 0.20, -h * 0.10);
    ctx.closePath();

    ctx.fillStyle = '#08202e';
    ctx.fill();
    ctx.shadowColor = primaryColor;
    ctx.shadowBlur = 14 * S;
    ctx.strokeStyle = primaryColor;
    ctx.lineWidth = 2.2 * S;
    ctx.stroke();

    ctx.shadowColor = accentColor;
    ctx.shadowBlur = 8 * S;
    ctx.fillStyle = accentColor;
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.36);
    ctx.lineTo(w * 0.11, h * 0.02);
    ctx.lineTo(-w * 0.11, h * 0.02);
    ctx.closePath();
    ctx.fill();

  } else if (style === 1) {
    /* CAZA — alas en flecha con doble cola */
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.55);
    ctx.lineTo(w * 0.13, -h * 0.15);
    ctx.lineTo(w * 0.55, h * 0.10);
    ctx.lineTo(w * 0.42, h * 0.32);
    ctx.lineTo(w * 0.15, h * 0.20);
    ctx.lineTo(w * 0.10, h * 0.42);
    ctx.lineTo(0, h * 0.34);
    ctx.lineTo(-w * 0.10, h * 0.42);
    ctx.lineTo(-w * 0.15, h * 0.20);
    ctx.lineTo(-w * 0.42, h * 0.32);
    ctx.lineTo(-w * 0.55, h * 0.10);
    ctx.lineTo(-w * 0.13, -h * 0.15);
    ctx.closePath();

    ctx.fillStyle = '#0a1830';
    ctx.fill();
    ctx.shadowColor = primaryColor;
    ctx.shadowBlur = 14 * S;
    ctx.strokeStyle = primaryColor;
    ctx.lineWidth = 2.2 * S;
    ctx.stroke();

    ctx.shadowColor = accentColor;
    ctx.shadowBlur = 8 * S;
    ctx.fillStyle = accentColor;
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.40);
    ctx.lineTo(w * 0.08, -h * 0.02);
    ctx.lineTo(-w * 0.08, -h * 0.02);
    ctx.closePath();
    ctx.fill();

  } else {
    /* DELTA — ala triangular */
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.55);
    ctx.lineTo(w * 0.55, h * 0.35);
    ctx.lineTo(w * 0.20, h * 0.35);
    ctx.lineTo(0, h * 0.15);
    ctx.lineTo(-w * 0.20, h * 0.35);
    ctx.lineTo(-w * 0.55, h * 0.35);
    ctx.closePath();

    ctx.fillStyle = '#101828';
    ctx.fill();
    ctx.shadowColor = primaryColor;
    ctx.shadowBlur = 14 * S;
    ctx.strokeStyle = primaryColor;
    ctx.lineWidth = 2.2 * S;
    ctx.stroke();

    ctx.shadowColor = accentColor;
    ctx.shadowBlur = 8 * S;
    ctx.fillStyle = accentColor;
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.34);
    ctx.lineTo(w * 0.08, h * 0.04);
    ctx.lineTo(-w * 0.08, h * 0.04);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
  ctx.shadowBlur = 0;
}

/* =========================================================
   9. ENTRADA: TECLADO
   ========================================================= */
const keys = Object.create(null);

function keyName(e) {
  if (e.key === ' ' || e.key === 'Spacebar' || e.code === 'Space') return 'space';
  if (e.key === 'Enter') return 'enter';
  if (e.key === 'Escape') return 'escape';
  return (e.key || '').toLowerCase();
}

window.addEventListener('keydown', function (e) {
  const k = keyName(e);
  if (k === 'space' || k === 'enter' || k.indexOf('arrow') === 0) e.preventDefault();

  /* ---------- MENÚ ---------- */
  if (state === 'menu') {
    if (e.repeat) return;
    if (k === 'space' || k === 'enter') {
      unlockAudio();
      startGame();
    } else if (k === 'arrowleft' || k === 'a') {
      selectedShip = (selectedShip + 2) % 3;
      saveSettings();
    } else if (k === 'arrowright' || k === 'd') {
      selectedShip = (selectedShip + 1) % 3;
      saveSettings();
    } else if (k === 'arrowup' || k === 'w') {
      selectedDiff = (selectedDiff + 2) % 3;
      saveSettings();
    } else if (k === 'arrowdown' || k === 's') {
      selectedDiff = (selectedDiff + 1) % 3;
      saveSettings();
    }
    return;
  }

  /* ---------- GAME OVER ---------- */
  if (state === 'gameover') {
    if (e.repeat) return;
    if (gameOverTimer > 30) {
      if (k === 'space' || k === 'enter') startGame();
      else if (k === 'escape') state = 'menu';
    }
    return;
  }

  /* ---------- JUGANDO ---------- */
  if (state === 'playing') {
    if (k === 'space') unlockAudio();
    if (e.repeat) return;
    keys[k] = true;
  }
}, { passive: false });

window.addEventListener('keyup', function (e) {
  keys[keyName(e)] = false;
}, { passive: false });

window.addEventListener('blur', function () {
  for (const k in keys) keys[k] = false;
  activePointer = null;
  touchFiring = false;
});

/* =========================================================
   10. ENTRADA: TÁCTIL / RATÓN (CONTROL RELATIVO)
   ========================================================= */
let activePointer = null;
let dragLastX = 0;
let dragLastY = 0;
let touchFiring = false;
const DRAG_SENS = 1.0;

function setupDrag(e) {
  activePointer = e.pointerId;
  dragLastX = e.clientX;
  dragLastY = e.clientY;
  touchFiring = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
}

canvas.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  unlockAudio();

  /* ---------- MENÚ ---------- */
  if (state === 'menu') {
    computeMenuLayout();
    const hit = hitTestMenu(e.clientX, e.clientY);
    if (hit) {
      if (hit.type === 'ship') {
        selectedShip = hit.value;
        saveSettings();
      } else if (hit.type === 'diff') {
        selectedDiff = hit.value;
        saveSettings();
      } else if (hit.type === 'play') {
        startGame();
        setupDrag(e);
      }
    }
    return;
  }

  /* ---------- GAME OVER ---------- */
  if (state === 'gameover') {
    if (gameOverTimer > 30) {
      const L = computeGameOverLayout();
      if (e.clientX >= L.retry.x && e.clientX <= L.retry.x + L.retry.w &&
          e.clientY >= L.retry.y && e.clientY <= L.retry.y + L.retry.h) {
        startGame();
        return;
      }
      if (e.clientX >= L.menu.x && e.clientX <= L.menu.x + L.menu.w &&
          e.clientY >= L.menu.y && e.clientY <= L.menu.y + L.menu.h) {
        state = 'menu';
        return;
      }
    }
    return;
  }

  /* ---------- JUGANDO ---------- */
  if (state !== 'playing') return;
  if (activePointer !== null) return;
  setupDrag(e);
}, { passive: false });

canvas.addEventListener('pointermove', function (e) {
  if (e.pointerId !== activePointer) return;
  e.preventDefault();
  if (state !== 'playing') return;

  const dx = e.clientX - dragLastX;
  const dy = e.clientY - dragLastY;

  player.x += dx * DRAG_SENS;
  player.y += dy * DRAG_SENS;
  clampPlayer();

  dragLastX = e.clientX;
  dragLastY = e.clientY;
}, { passive: false });

function endPointer(e) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  touchFiring = false;
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

/* Evitar scroll / zoom accidental en móviles */
document.addEventListener('touchmove', function (e) {
  if (e.target === canvas) e.preventDefault();
}, { passive: false });

document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });

/* =========================================================
   11. LAYOUT DEL MENÚ Y GAME OVER
   ========================================================= */
let menuLayout = {
  titleY: 0, shipLabelY: 0, ships: [],
  diffLabelY: 0, diffs: [], play: {}, diffY: 0
};

function computeMenuLayout() {
  const titleY = H * 0.14;
  const shipLabelY = H * 0.34;
  const shipSize = Math.min(W * 0.20, 92 * S);
  const shipY = H * 0.47;
  const shipGap = Math.min(W * 0.26, 110 * S);
  const shipStartX = W * 0.5 - shipGap;

  const ships = [];
  for (let i = 0; i < 3; i++) {
    const cx = shipStartX + i * shipGap;
    ships.push({
      cx: cx, cy: shipY,
      x: cx - shipSize * 0.5,
      y: shipY - shipSize * 0.5,
      w: shipSize, h: shipSize,
      index: i
    });
  }

  const diffLabelY = H * 0.66;
  const diffW = Math.min(W * 0.24, 96 * S);
  const diffH = Math.min(44 * S, 52);
  const diffGap = Math.min(W * 0.28, 112 * S);
  const diffStartX = W * 0.5 - diffGap;
  const diffY = H * 0.76;

  const diffs = [];
  for (let i = 0; i < 3; i++) {
    const cx = diffStartX + i * diffGap;
    diffs.push({
      cx: cx, cy: diffY,
      x: cx - diffW * 0.5,
      y: diffY - diffH * 0.5,
      w: diffW, h: diffH,
      index: i
    });
  }

  const btnW = Math.min(W * 0.55, 220 * S);
  const btnH = Math.min(52 * S, 58);
  const btnY = H * 0.90;
  const play = {
    x: W * 0.5 - btnW * 0.5,
    y: btnY - btnH * 0.5,
    w: btnW, h: btnH,
    cx: W * 0.5, cy: btnY
  };

  menuLayout = {
    titleY: titleY,
    shipLabelY: shipLabelY,
    ships: ships,
    diffLabelY: diffLabelY,
    diffs: diffs,
    play: play,
    diffY: diffY
  };
  return menuLayout;
}

function hitTestMenu(px, py) {
  const L = menuLayout;
  for (let i = 0; i < L.ships.length; i++) {
    const s = L.ships[i];
    if (px >= s.x && px <= s.x + s.w && py >= s.y && py <= s.y + s.h) {
      return { type: 'ship', value: i };
    }
  }
  for (let i = 0; i < L.diffs.length; i++) {
    const d = L.diffs[i];
    if (px >= d.x && px <= d.x + d.w && py >= d.y && py <= d.y + d.h) {
      return { type: 'diff', value: i };
    }
  }
  const p = L.play;
  if (px >= p.x && px <= p.x + p.w && py >= p.y && py <= p.y + p.h) {
    return { type: 'play' };
  }
  return null;
}

function computeGameOverLayout() {
  const btnW = Math.min(W * 0.36, 150 * S);
  const btnH = Math.min(48 * S, 54);
  const gap = Math.min(W * 0.05, 22 * S);
  const totalW = btnW * 2 + gap;
  const startX = W * 0.5 - totalW * 0.5;
  const btnY = H * 0.78;

  return {
    retry: { x: startX, y: btnY - btnH * 0.5, w: btnW, h: btnH, cx: startX + btnW * 0.5, cy: btnY },
    menu: { x: startX + btnW + gap, y: btnY - btnH * 0.5, w: btnW, h: btnH, cx: startX + btnW + gap + btnW * 0.5, cy: btnY }
  };
}

/* =========================================================
   12. FÁBRICAS DE ENTIDADES
   ========================================================= */
function makeBullet(x, y, vx, vy) {
  return { x: x, y: y, vx: vx, vy: vy, w: 4.5 * S, h: 15 * S, dmg: 1 };
}

function makeEnemy(type) {
  const diff = DIFFICULTY[selectedDiff];
  const lvl = level;
  const spdMul = Math.min(2.35, (1 + (lvl - 1) * 0.07) * diff.enemySpeedMul);
  let e;

  if (type === 0) {
    e = {
      type: 0,
      w: 26 * S, h: 26 * S,
      hp: Math.max(1, 1 + Math.floor((lvl - 1) / 3) + diff.enemyHpBonus),
      vy: (1.7 + Math.random() * 0.5) * S * spdMul,
      score: 10,
      color: '#ff3f7a',
      drift: (Math.random() < 0.5 ? -1 : 1) * (0.25 + Math.random() * 0.5)
    };
    e.x = Math.random() * (W - e.w) + e.w * 0.5;
    e.y = -e.h;
  } else if (type === 1) {
    e = {
      type: 1,
      w: 22 * S, h: 22 * S,
      hp: Math.max(1, 1 + Math.floor((lvl - 1) / 4) + diff.enemyHpBonus),
      vy: (2.5 + Math.random() * 0.7) * S * spdMul,
      score: 15,
      color: '#ffe14f'
    };
    e.baseX = clamp(Math.random() * W, 70 * S, W - 70 * S);
    e.x = e.baseX;
    e.y = -e.h;
    e.amp = (22 + Math.random() * 48) * S;
    e.freq = 0.07 + Math.random() * 0.05;
  } else {
    e = {
      type: 2,
      w: 46 * S, h: 46 * S,
      hp: Math.max(2, 5 + Math.floor((lvl - 1) * 0.9) + diff.enemyHpBonus),
      vy: (0.85 + Math.random() * 0.3) * S * spdMul * 0.85,
      score: 40,
      color: '#b46bff',
      shootCd: 100
    };
    e.x = Math.random() * (W - e.w) + e.w * 0.5;
    e.y = -e.h;
  }

  e.maxHp = e.hp;
  e.t = Math.random() * 100;
  e.flash = 0;
  return e;
}

function spawnEnemy() {
  if (enemies.length > 42) return;
  const lvl = level;
  const r = Math.random();
  let type = 0;

  const pZig = lvl >= 2 ? Math.min(0.36, 0.10 + lvl * 0.05) : 0;
  const pTank = lvl >= 3 ? Math.min(0.22, 0.04 + lvl * 0.03) : 0;

  if (r < pTank) type = 2;
  else if (r < pTank + pZig) type = 1;
  else type = 0;

  enemies.push(makeEnemy(type));
}

const POWER_DEFS = [
  { label: 'T', color: '#4ff0ff' },
  { label: 'S', color: '#7dff6b' },
  { label: 'O', color: '#ffd24f' }
];

function spawnPowerup(x, y) {
  const r = Math.random();
  let type;
  if (r < 0.40) type = 0;
  else if (r < 0.74) type = 1;
  else type = 2;

  powerups.push({
    x: x, y: y,
    w: 24 * S, h: 24 * S,
    vy: 1.7 * S,
    type: type,
    label: POWER_DEFS[type].label,
    color: POWER_DEFS[type].color,
    t: 0
  });
}

/* =========================================================
   13. DISPARO DEL JUGADOR
   ========================================================= */
function fire() {
  const bs = 14.5 * S;
  const bx = player.x;
  const by = player.y - player.h * 0.52;

  if (player.triple > 0) {
    bullets.push(makeBullet(bx, by, 0, -bs));
    bullets.push(makeBullet(bx - 10 * S, by + 5 * S, -3.4 * S, -bs * 0.93));
    bullets.push(makeBullet(bx + 10 * S, by + 5 * S, 3.4 * S, -bs * 0.93));
  } else {
    bullets.push(makeBullet(bx, by, 0, -bs));
  }
  sfxShoot();
}

/* =========================================================
   14. INICIO / FIN DE PARTIDA
   ========================================================= */
function startGame() {
  state = 'playing';
  score = 0;
  level = 1;
  time = 0;
  spawnTimer = 45;
  gameOverTimer = 0;
  shakeTime = 0;

  const diff = DIFFICULTY[selectedDiff];

  player.x = W / 2;
  player.y = H - 110 * S;
  player.lives = diff.lives;
  player.invuln = 100;
  player.shield = 0;
  player.triple = 0;
  player.speedBoost = 0;
  player.shootCd = 0;

  bullets.length = 0;
  ebullets.length = 0;
  enemies.length = 0;
  powerups.length = 0;
  particles.length = 0;

  activePointer = null;
  touchFiring = false;
  for (const k in keys) keys[k] = false;

  clampPlayer();
}

function gameOver() {
  state = 'gameover';
  gameOverTimer = 0;
  sfxPlayerHit();
  sfxExplosion(0.45);
  spawnExplosion(player.x, player.y, 70, SHIPS[selectedShip].color);
  spawnExplosion(player.x, player.y, 40, '#ff4fa3');
  shake(16, 26);

  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('neonvoid_hs', String(highScore)); } catch (e) {}
  }
}

function damagePlayer() {
  if (player.invuln > 0 || player.shield > 0) return;
  player.lives--;
  player.invuln = 130;
  shake(11, 18);
  sfxPlayerHit();
  spawnExplosion(player.x, player.y, 26, SHIPS[selectedShip].color);

  if (player.lives <= 0) gameOver();
}

/* =========================================================
   15. ACTUALIZACIÓN
   ========================================================= */
function updatePlayer(dt) {
  let dx = 0, dy = 0;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;

  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    const spd = 7.4 * S * (player.speedBoost > 0 ? 1.65 : 1);
    player.x += (dx / len) * spd * dt;
    player.y += (dy / len) * spd * dt;
    clampPlayer();
  }

  if (player.invuln > 0) player.invuln -= dt;
  if (player.shield > 0) player.shield -= dt;
  if (player.triple > 0) player.triple -= dt;
  if (player.speedBoost > 0) player.speedBoost -= dt;

  player.shootCd -= dt;
  const firing = keys['space'] === true || touchFiring;
  if (firing && player.shootCd <= 0) {
    fire();
    player.shootCd = player.triple > 0 ? 7.2 : 9.2;
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y < -30 * S || b.x < -30 * S || b.x > W + 30 * S) bullets.splice(i, 1);
  }
}

function enemyShoot(e) {
  const dx = player.x - e.x;
  const dy = player.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  const sp = 4.3 * S;
  ebullets.push({
    x: e.x, y: e.y + e.h * 0.3,
    vx: (dx / d) * sp, vy: (dy / d) * sp,
    w: 9 * S, h: 9 * S
  });
}

function updateEnemies(dt) {
  const diff = DIFFICULTY[selectedDiff];
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;

    if (e.type === 0) {
      e.y += e.vy * dt;
      e.x += e.drift * S * dt;
      if (e.x < e.w * 0.5 || e.x > W - e.w * 0.5) e.drift *= -1;
      e.x = clamp(e.x, e.w * 0.5, W - e.w * 0.5);
    } else if (e.type === 1) {
      e.y += e.vy * dt;
      e.x = clamp(e.baseX + Math.sin(e.t * e.freq) * e.amp, e.w * 0.5, W - e.w * 0.5);
    } else {
      e.y += e.vy * dt;
      e.shootCd -= dt;
      if (e.shootCd <= 0 && e.y > 0 && e.y < H * 0.78) {
        e.shootCd = Math.max(40, (120 - level * 6) * diff.enemyShootMul);
        enemyShoot(e);
      }
    }

    if (e.y - e.h * 0.5 > H + 70 * S) enemies.splice(i, 1);
  }
}

function updateEBullets(dt) {
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y > H + 40 * S || b.y < -40 * S || b.x < -40 * S || b.x > W + 40 * S) {
      ebullets.splice(i, 1);
    }
  }
}

function updatePowerups(dt) {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.t += dt;
    p.y += p.vy * dt;
    p.x += Math.sin(p.t * 0.05) * 0.8 * S * dt;
    if (p.y - p.h > H + 30 * S) powerups.splice(i, 1);
  }
}

function updateSpawner(dt) {
  const diff = DIFFICULTY[selectedDiff];
  const newLevel = 1 + Math.floor(score / 240);
  if (newLevel > level) level = newLevel;

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnEnemy();
    const base = Math.max(15, 56 - level * 3.4);
    spawnTimer = base * (0.65 + Math.random() * 0.7) * diff.spawnMul;
  }
}

/* =========================================================
   16. COLISIONES
   ========================================================= */
function killEnemy(e, idx) {
  enemies.splice(idx, 1);
  score += e.score;
  if (score > highScore) highScore = score;

  spawnExplosion(e.x, e.y, e.type === 2 ? 30 : 15, e.color);
  sfxExplosion(e.type === 2 ? 0.30 : 0.18);
  shake(e.type === 2 ? 9 : 4, e.type === 2 ? 14 : 7);

  const dropChance = e.type === 2 ? 0.5 : 0.085;
  if (Math.random() < dropChance) spawnPowerup(e.x, e.y);
}

function applyPowerup(p) {
  if (p.type === 0) player.triple = 60 * 9;
  else if (p.type === 1) player.speedBoost = 60 * 8;
  else player.shield = 60 * 7;

  sfxPowerup();
  spawnExplosion(p.x, p.y, 18, p.color);
}

function collisions() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    let hitSomething = false;

    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (!aabb(b, e)) continue;

      e.hp -= b.dmg;
      e.flash = 7;
      spawnExplosion(b.x, b.y, 3, '#bff9ff');
      hitSomething = true;

      if (e.hp <= 0) killEnemy(e, j);
      break;
    }

    if (hitSomething) bullets.splice(i, 1);
  }

  const pBox = { x: player.x, y: player.y, w: player.w * 0.68, h: player.h * 0.68 };

  for (let j = enemies.length - 1; j >= 0; j--) {
    const e = enemies[j];
    if (!aabb(pBox, e)) continue;

    if (player.shield > 0 || player.invuln > 0) {
      if (player.shield > 0) {
        spawnExplosion(e.x, e.y, 18, '#ffd24f');
        enemies.splice(j, 1);
        score += e.score;
        sfxExplosion(0.16);
      }
    } else {
      spawnExplosion(e.x, e.y, 18, e.color);
      enemies.splice(j, 1);
      damagePlayer();
      if (state !== 'playing') return;
    }
  }

  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    if (!aabb(pBox, b)) continue;

    if (player.shield > 0 || player.invuln > 0) {
      spawnExplosion(b.x, b.y, 8, '#ffd24f');
      ebullets.splice(i, 1);
    } else {
      ebullets.splice(i, 1);
      damagePlayer();
      if (state !== 'playing') return;
    }
  }

  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    const box = { x: p.x, y: p.y, w: p.w * 1.35, h: p.h * 1.35 };
    if (aabb(pBox, box)) {
      applyPowerup(p);
      powerups.splice(i, 1);
    }
  }
}

/* =========================================================
   17. BUCLE DE ACTUALIZACIÓN
   ========================================================= */
function update(dt) {
  updateStars(dt);
  updateParticles(dt);
  if (shakeTime > 0) shakeTime -= dt;

  if (state === 'playing') {
    updatePlayer(dt);
    updateBullets(dt);
    updateEnemies(dt);
    updateEBullets(dt);
    updatePowerups(dt);
    updateSpawner(dt);
    collisions();
  } else if (state === 'gameover') {
    gameOverTimer += dt;
    updateEnemies(dt);
    updateEBullets(dt);
  }
}

/* =========================================================
   18. DIBUJO DE ENTIDADES
   ========================================================= */
function drawPlayer() {
  if (state === 'gameover' && player.lives <= 0) return;

  if (player.invuln > 0 && player.shield <= 0) {
    const blink = Math.sin(player.invuln * 0.45);
    if (blink < -0.15) return;
  }

  const ship = SHIPS[selectedShip];
  const x = player.x;
  const y = player.y;
  const w = player.w;
  const h = player.h;

  /* Llama del motor */
  ctx.save();
  ctx.translate(x, y);
  const flame = 1 + Math.sin(time * 0.6) * 0.35;
  const fh = h * 0.55 * flame;
  const grad = ctx.createLinearGradient(0, h * 0.4, 0, h * 0.4 + fh);
  grad.addColorStop(0, hexToRgba(ship.color, 0.95));
  grad.addColorStop(0.5, hexToRgba(ship.color, 0.55));
  grad.addColorStop(1, hexToRgba(ship.color, 0));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-w * 0.17, h * 0.34);
  ctx.lineTo(w * 0.17, h * 0.34);
  ctx.lineTo(0, h * 0.34 + fh);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  /* Cuerpo */
  drawShipShape(x, y, w, h, selectedShip, ship.color, ship.accent);

  /* Escudo */
  if (player.shield > 0) {
    const pulse = 1 + Math.sin(time * 0.22) * 0.06;
    const alpha = player.shield < 90 ? (0.35 + 0.35 * Math.sin(time * 0.55)) : 0.75;
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = '#ffd24f';
    ctx.shadowBlur = 18 * S;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ffd24f';
    ctx.lineWidth = 2.4 * S;
    ctx.beginPath();
    ctx.arc(0, 0, w * 0.86 * pulse, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  ctx.shadowBlur = 0;
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);

  const w = e.w, h = e.h;
  const hitFlash = e.flash > 0;

  if (e.type === 0) {
    ctx.beginPath();
    ctx.moveTo(0, h * 0.52);
    ctx.lineTo(-w * 0.5, -h * 0.30);
    ctx.lineTo(-w * 0.22, -h * 0.52);
    ctx.lineTo(w * 0.22, -h * 0.52);
    ctx.lineTo(w * 0.5, -h * 0.30);
    ctx.closePath();
    ctx.fillStyle = hitFlash ? '#ffffff' : '#2b0a18';
    ctx.fill();
    ctx.shadowColor = '#ff3f7a';
    ctx.shadowBlur = 10 * S;
    ctx.strokeStyle = hitFlash ? '#ffffff' : '#ff3f7a';
    ctx.lineWidth = 2.1 * S;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = hitFlash ? '#ffffff' : '#ff9ec2';
    ctx.fillRect(-w * 0.10, -h * 0.22, w * 0.20, h * 0.34);
  } else if (e.type === 1) {
    ctx.beginPath();
    ctx.moveTo(0, h * 0.52);
    ctx.lineTo(w * 0.5, 0);
    ctx.lineTo(0, -h * 0.52);
    ctx.lineTo(-w * 0.5, 0);
    ctx.closePath();
    ctx.fillStyle = hitFlash ? '#ffffff' : '#2e2708';
    ctx.fill();
    ctx.shadowColor = '#ffe14f';
    ctx.shadowBlur = 10 * S;
    ctx.strokeStyle = hitFlash ? '#ffffff' : '#ffe14f';
    ctx.lineWidth = 2.1 * S;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = hitFlash ? '#ffffff' : '#fff3a8';
    ctx.beginPath();
    ctx.arc(0, 0, w * 0.15, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(-w * 0.5, -h * 0.28);
    ctx.lineTo(0, -h * 0.52);
    ctx.lineTo(w * 0.5, -h * 0.28);
    ctx.lineTo(w * 0.5, h * 0.28);
    ctx.lineTo(0, h * 0.52);
    ctx.lineTo(-w * 0.5, h * 0.28);
    ctx.closePath();
    ctx.fillStyle = hitFlash ? '#ffffff' : '#200a33';
    ctx.fill();
    ctx.shadowColor = '#b46bff';
    ctx.shadowBlur = 13 * S;
    ctx.strokeStyle = hitFlash ? '#ffffff' : '#b46bff';
    ctx.lineWidth = 2.6 * S;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = hitFlash ? '#ffffff' : '#d8aaff';
    ctx.beginPath();
    ctx.arc(0, 0, w * 0.17, 0, Math.PI * 2);
    ctx.fill();

    if (e.maxHp > 1) {
      const bw = w * 0.9;
      const ratio = Math.max(0, e.hp / e.maxHp);
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.fillRect(-bw * 0.5, -h * 0.5 - 9 * S, bw, 4 * S);
      ctx.fillStyle = ratio > 0.5 ? '#8affc1' : (ratio > 0.25 ? '#ffd24f' : '#ff4f6b');
      ctx.fillRect(-bw * 0.5, -h * 0.5 - 9 * S, bw * ratio, 4 * S);
    }
  }

  ctx.restore();
  ctx.shadowBlur = 0;
}

function drawBullets() {
  const shipColor = SHIPS[selectedShip].color;
  ctx.save();
  ctx.shadowColor = shipColor;
  ctx.shadowBlur = 12 * S;
  ctx.fillStyle = '#f0ffff';
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    ctx.fillRect(b.x - b.w * 0.5, b.y - b.h * 0.5, b.w, b.h);
  }
  ctx.restore();
  ctx.shadowBlur = 0;
}

function drawEBullets() {
  ctx.save();
  ctx.shadowColor = '#ff3f7a';
  ctx.shadowBlur = 10 * S;
  ctx.fillStyle = '#ff8fb8';
  for (let i = 0; i < ebullets.length; i++) {
    const b = ebullets[i];
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.w * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  ctx.shadowBlur = 0;
}

function drawPowerups() {
  for (let i = 0; i < powerups.length; i++) {
    const p = powerups[i];
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.sin(p.t * 0.05) * 0.32);

    const s = p.w;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 14 * S;
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2.6 * S;
    ctx.strokeRect(-s * 0.5, -s * 0.5, s, s);

    ctx.globalAlpha = 0.18;
    ctx.fillStyle = p.color;
    ctx.fillRect(-s * 0.5, -s * 0.5, s, s);
    ctx.globalAlpha = 1;

    ctx.shadowBlur = 6 * S;
    ctx.fillStyle = p.color;
    ctx.font = 'bold ' + Math.round(s * 0.62) + 'px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.label, 0, s * 0.04);

    ctx.restore();
  }
  ctx.shadowBlur = 0;
}

/* =========================================================
   19. HUD Y PANTALLAS
   ========================================================= */
function drawShipIcon(cx, cy, size, color) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - size * 0.62);
  ctx.lineTo(cx + size * 0.55, cy + size * 0.5);
  ctx.lineTo(cx, cy + size * 0.22);
  ctx.lineTo(cx - size * 0.55, cy + size * 0.5);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'top';

  ctx.textAlign = 'left';
  ctx.font = 'bold ' + Math.round(17 * S) + 'px "Courier New", monospace';
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 10 * S;
  ctx.fillStyle = '#9ff4ff';
  ctx.fillText('PUNTOS ' + score, 14 * S, 12 * S);

  ctx.textAlign = 'center';
  ctx.font = 'bold ' + Math.round(11 * S) + 'px "Courier New", monospace';
  ctx.shadowColor = '#a06bff';
  ctx.shadowBlur = 8 * S;
  ctx.fillStyle = '#b79dff';
  ctx.fillText('RÉCORD ' + Math.max(highScore, score), W * 0.5, 16 * S);

  const iconSize = 15 * S;
  const startX = W - 16 * S - iconSize * 0.6;
  for (let i = 0; i < player.lives; i++) {
    const cx = startX - i * (iconSize * 1.45);
    ctx.shadowColor = '#4ff0ff';
    ctx.shadowBlur = 10 * S;
    drawShipIcon(cx, 22 * S, iconSize, '#4ff0ff');
  }

  ctx.textAlign = 'left';
  ctx.shadowBlur = 0;
  ctx.font = 'bold ' + Math.round(10 * S) + 'px "Courier New", monospace';
  ctx.fillStyle = 'rgba(160,200,255,0.55)';
  ctx.fillText('OLEADA ' + level + '  ·  ' + DIFFICULTY[selectedDiff].name, 14 * S, 34 * S);

  let py = H - 26 * S;
  ctx.textAlign = 'left';
  ctx.font = 'bold ' + Math.round(11 * S) + 'px "Courier New", monospace';

  if (player.triple > 0) {
    ctx.fillStyle = '#4ff0ff';
    ctx.fillText('TRIPLE ' + Math.ceil(player.triple / 60) + 's', 14 * S, py);
    py -= 15 * S;
  }
  if (player.speedBoost > 0) {
    ctx.fillStyle = '#7dff6b';
    ctx.fillText('TURBO ' + Math.ceil(player.speedBoost / 60) + 's', 14 * S, py);
    py -= 15 * S;
  }
  if (player.shield > 0) {
    ctx.fillStyle = '#ffd24f';
    ctx.fillText('ESCUDO ' + Math.ceil(player.shield / 60) + 's', 14 * S, py);
  }

  ctx.restore();
  ctx.shadowBlur = 0;
}

function drawMenu() {
  const L = computeMenuLayout();

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  /* Título */
  const titleSize = Math.round(Math.min(W * 0.14, 72 * S));
  ctx.font = 'bold ' + titleSize + 'px "Courier New", monospace';
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 26 * S;
  ctx.fillStyle = '#b6f8ff';
  ctx.fillText('NEÓN', W * 0.5, L.titleY);

  ctx.shadowColor = '#ff4fa3';
  ctx.fillStyle = '#ff8ac4';
  ctx.fillText('VOID', W * 0.5, L.titleY + titleSize * 1.02);

  /* Récord */
  if (highScore > 0) {
    ctx.shadowBlur = 8 * S;
    ctx.shadowColor = '#a06bff';
    ctx.fillStyle = '#b79dff';
    ctx.font = 'bold ' + Math.round(Math.min(13 * S, W * 0.038)) + 'px "Courier New", monospace';
    ctx.fillText('RÉCORD: ' + highScore, W * 0.5, H * 0.055);
  }

  /* Etiqueta naves */
  ctx.shadowBlur = 8 * S;
  ctx.shadowColor = '#00e5ff';
  ctx.fillStyle = '#7fd8ff';
  ctx.font = 'bold ' + Math.round(Math.min(13 * S, W * 0.036)) + 'px "Courier New", monospace';
  ctx.fillText('ELIGE TU NAVE', W * 0.5, L.shipLabelY);

  /* Previsualizaciones de naves */
  for (let i = 0; i < L.ships.length; i++) {
    const r = L.ships[i];
    const isSel = selectedShip === i;
    const ship = SHIPS[i];

    ctx.save();
    if (isSel) {
      ctx.shadowColor = ship.color;
      ctx.shadowBlur = 16 * S;
      ctx.strokeStyle = ship.color;
      ctx.lineWidth = 2.4 * S;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.globalAlpha = 0.10;
      ctx.fillStyle = ship.color;
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.globalAlpha = 1;
    } else {
      ctx.strokeStyle = 'rgba(120, 160, 220, 0.30)';
      ctx.lineWidth = 1.4 * S;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
    }
    ctx.restore();

    const bob = isSel ? Math.sin(time * 0.08) * 2 * S : 0;
    drawShipShape(r.cx, r.cy + bob, r.w * 0.72, r.h * 0.72, i, ship.color, ship.accent);

    ctx.save();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = isSel ? 1 : 0.45;
    ctx.fillStyle = isSel ? ship.color : '#8899bb';
    ctx.font = 'bold ' + Math.round(Math.min(10 * S, W * 0.027)) + 'px "Courier New", monospace';
    ctx.fillText(ship.name, r.cx, r.y + r.h + 14 * S);
    ctx.restore();
  }

  /* Etiqueta dificultad */
  ctx.save();
  ctx.shadowBlur = 8 * S;
  ctx.shadowColor = '#ff4fa3';
  ctx.fillStyle = '#ff9ec2';
  ctx.font = 'bold ' + Math.round(Math.min(13 * S, W * 0.036)) + 'px "Courier New", monospace';
  ctx.fillText('DIFICULTAD', W * 0.5, L.diffLabelY);
  ctx.restore();

  /* Botones de dificultad */
  for (let i = 0; i < L.diffs.length; i++) {
    const r = L.diffs[i];
    const isSel = selectedDiff === i;
    const diff = DIFFICULTY[i];

    ctx.save();
    if (isSel) {
      ctx.shadowColor = diff.color;
      ctx.shadowBlur = 14 * S;
      ctx.globalAlpha = 0.20;
      ctx.fillStyle = diff.color;
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = diff.color;
      ctx.lineWidth = 2.4 * S;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
    } else {
      ctx.strokeStyle = 'rgba(120, 160, 220, 0.30)';
      ctx.lineWidth = 1.4 * S;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
    }

    ctx.shadowBlur = isSel ? 8 * S : 0;
    ctx.shadowColor = isSel ? diff.color : 'transparent';
    ctx.fillStyle = isSel ? diff.color : 'rgba(150, 180, 220, 0.6)';
    ctx.font = 'bold ' + Math.round(r.h * 0.36) + 'px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(diff.name, r.cx, r.cy + 1);
    ctx.restore();
  }

  /* Botón JUGAR */
  const playRegion = L.play;
  const pulse = 0.75 + 0.25 * Math.sin(time * 0.08);
  ctx.save();
  ctx.shadowColor = '#4ff0ff';
  ctx.shadowBlur = 18 * S * pulse;
  ctx.strokeStyle = '#4ff0ff';
  ctx.lineWidth = 2.6 * S;
  ctx.strokeRect(playRegion.x, playRegion.y, playRegion.w, playRegion.h);

  ctx.globalAlpha = 0.12 + 0.06 * pulse;
  ctx.fillStyle = '#4ff0ff';
  ctx.fillRect(playRegion.x, playRegion.y, playRegion.w, playRegion.h);
  ctx.globalAlpha = 1;

  ctx.shadowBlur = 10 * S;
  ctx.fillStyle = '#b6f8ff';
  ctx.font = 'bold ' + Math.round(playRegion.h * 0.42) + 'px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('JUGAR', playRegion.cx, playRegion.cy + 1);
  ctx.restore();

  /* Pista de controles */
  ctx.save();
  ctx.shadowBlur = 0;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + Math.round(Math.min(9 * S, W * 0.024)) + 'px "Courier New", monospace';
  ctx.fillStyle = 'rgba(130, 160, 200, 0.5)';
  ctx.fillText('← → NAVE · ↑ ↓ DIFICULTAD · ESPACIO JUGAR', W * 0.5, H * 0.97);
  ctx.restore();

  ctx.restore();
  ctx.shadowBlur = 0;
}

function drawGameOverScreen() {
  ctx.save();

  ctx.fillStyle = 'rgba(5,3,13,0.75)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const tSize = Math.round(Math.min(W * 0.115, 66 * S));
  ctx.font = 'bold ' + tSize + 'px "Courier New", monospace';
  ctx.shadowColor = '#ff2f6f';
  ctx.shadowBlur = 26 * S;
  ctx.fillStyle = '#ff7aa8';
  ctx.fillText('GAME OVER', W * 0.5, H * 0.28);

  ctx.shadowBlur = 12 * S;
  ctx.shadowColor = '#00e5ff';
  ctx.fillStyle = '#b6f8ff';
  ctx.font = 'bold ' + Math.round(Math.min(22 * S, W * 0.062)) + 'px "Courier New", monospace';
  ctx.fillText('PUNTUACIÓN: ' + score, W * 0.5, H * 0.43);

  ctx.shadowColor = '#a06bff';
  ctx.fillStyle = '#c6aaff';
  ctx.font = 'bold ' + Math.round(Math.min(16 * S, W * 0.046)) + 'px "Courier New", monospace';
  ctx.fillText('RÉCORD: ' + highScore, W * 0.5, H * 0.50);

  if (score >= highScore && score > 0) {
    ctx.shadowColor = '#ffd24f';
    ctx.fillStyle = '#ffe27a';
    ctx.font = 'bold ' + Math.round(Math.min(14 * S, W * 0.040)) + 'px "Courier New", monospace';
    ctx.fillText('¡NUEVO RÉCORD!', W * 0.5, H * 0.57);
  }

  /* Botones */
  const L = computeGameOverLayout();
  const canAct = gameOverTimer > 30;
  const alpha = canAct ? 1 : 0.35;

  ctx.globalAlpha = alpha;

  ctx.shadowColor = '#4ff0ff';
  ctx.shadowBlur = 14 * S;
  ctx.strokeStyle = '#4ff0ff';
  ctx.lineWidth = 2.4 * S;
  ctx.strokeRect(L.retry.x, L.retry.y, L.retry.w, L.retry.h);
  ctx.shadowBlur = 8 * S;
  ctx.fillStyle = '#b6f8ff';
  ctx.font = 'bold ' + Math.round(L.retry.h * 0.38) + 'px "Courier New", monospace';
  ctx.fillText('REINTENTAR', L.retry.cx, L.retry.cy + 1);

  ctx.shadowColor = '#a06bff';
  ctx.shadowBlur = 14 * S;
  ctx.strokeStyle = '#a06bff';
  ctx.lineWidth = 2.4 * S;
  ctx.strokeRect(L.menu.x, L.menu.y, L.menu.w, L.menu.h);
  ctx.shadowBlur = 8 * S;
  ctx.fillStyle = '#c6aaff';
  ctx.font = 'bold ' + Math.round(L.menu.h * 0.38) + 'px "Courier New", monospace';
  ctx.fillText('MENÚ', L.menu.cx, L.menu.cy + 1);

  if (canAct) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(time * 0.08);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(150, 180, 220, 0.7)';
    ctx.font = 'bold ' + Math.round(Math.min(10 * S, W * 0.026)) + 'px "Courier New", monospace';
    ctx.fillText('ESPACIO = REINTENTAR · ESC = MENÚ', W * 0.5, H * 0.91);
  }

  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.shadowBlur = 0;
}

/* =========================================================
   20. RENDER PRINCIPAL
   ========================================================= */
function render() {
  ctx.fillStyle = '#05030d';
  ctx.fillRect(0, 0, W, H);

  ctx.save();

  if (shakeTime > 0 && shakeMax > 0) {
    const m = shakeMag * (shakeTime / shakeMax);
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }

  drawStars();

  if (state === 'menu') {
    ctx.restore();
    drawMenu();
    return;
  }

  drawPowerups();
  for (let i = 0; i < enemies.length; i++) drawEnemy(enemies[i]);
  drawEBullets();
  drawBullets();

  if (state === 'playing') drawPlayer();

  drawParticles();

  ctx.restore();

  if (state === 'playing') drawHUD();
  if (state === 'gameover') {
    drawHUD();
    drawGameOverScreen();
  }
}

/* =========================================================
   21. BUCLE PRINCIPAL
   ========================================================= */
let lastTS = 0;

function loop(ts) {
  requestAnimationFrame(loop);

  if (!lastTS) lastTS = ts;
  let dt = (ts - lastTS) / (1000 / 60);
  lastTS = ts;

  if (dt > 3) dt = 3;
  if (dt < 0 || !isFinite(dt)) dt = 0;

  time += dt;

  update(dt);
  render();
}

/* =========================================================
   22. ARRANQUE
   ========================================================= */
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () {
  setTimeout(resize, 120);
});

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function () {
    setTimeout(resize, 60);
  });
}

document.addEventListener('visibilitychange', function () {
  if (document.hidden) lastTS = 0;
});

resize();
requestAnimationFrame(loop);

})();
</script>
</body>
