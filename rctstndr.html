<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mejores recetas — RoastLab</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#fff; color:#0a0a0a; font-family:'Poppins','DejaVu Sans',system-ui,sans-serif; overflow-x:hidden; }
  .wake-bar { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px; background:#0a0a0a; color:#fff; padding:12px 16px; font-size:15px; font-weight:600; }
  .wake-bar .dot { width:10px; height:10px; border-radius:50%; background:#ff4d4d; flex-shrink:0; transition:background .2s; }
  .wake-bar.on .dot { background:#33e07a; }
  .wake-bar .txt { flex:1; }
  .wake-btn { background:#fff; color:#0a0a0a; border:none; border-radius:10px; padding:8px 14px; font-size:14px; font-weight:700; font-family:inherit; }
  .swipe-hint { text-align:center; font-size:13px; color:#8a8a8a; padding:10px 8px 4px; }
  .dots { display:flex; justify-content:center; gap:7px; padding:6px 10px 8px; flex-wrap:wrap; }
  .dots span { width:8px; height:8px; border-radius:50%; background:#d0d0d0; }
  .dots span.active { background:#0a0a0a; }
  .carousel { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; width:100%; }
  .card { flex:0 0 100%; width:100%; scroll-snap-align:start; padding:20px 24px 60px; max-width:480px; margin:0 auto; }
  .eyebrow { font-size:14px; font-weight:600; letter-spacing:2.5px; text-transform:uppercase; }
  h1 { font-size:36px; font-weight:700; margin:6px 0 0; line-height:1.08; letter-spacing:-.5px; }
  .subtitle { font-size:17px; margin-top:8px; color:#2a2a2a; line-height:1.35; }
  .rule { height:2px; background:#0a0a0a; width:100%; margin:20px 0; }
  .spec-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  .spec-label { font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:#4a4a4a; margin-bottom:3px; }
  .spec-value { font-size:21px; font-weight:600; line-height:1.15; }
  .spec-value .unit { font-size:13px; font-weight:400; color:#4a4a4a; }
  .section-title { font-size:17px; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:12px; display:flex; align-items:center; }
  .section-title .num { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; border:2px solid #0a0a0a; font-size:14px; margin-right:10px; flex-shrink:0; }
  .pours-row { display:flex; align-items:flex-start; justify-content:space-between; margin:0 2px 6px; position:relative; gap:4px; }
  .pour-stop { display:flex; flex-direction:column; align-items:center; z-index:2; flex:1; min-width:0; }
  .pour-dot { width:14px; height:14px; border-radius:50%; background:#0a0a0a; margin-bottom:8px; }
  .pour-ml { font-size:16px; font-weight:700; white-space:nowrap; }
  .pour-name { font-size:11px; color:#4a4a4a; margin-top:3px; text-align:center; }
  .pours-line { position:absolute; top:7px; left:7%; right:7%; height:2px; background:#0a0a0a; z-index:1; }
  .pours-note { font-size:14px; color:#2a2a2a; margin-top:12px; line-height:1.45; border-left:3px solid #0a0a0a; padding-left:12px; }
  .technique-list { display:flex; flex-direction:column; gap:10px; }
  .t-item { font-size:15px; line-height:1.42; padding-left:16px; position:relative; }
  .t-item::before { content:""; position:absolute; left:0; top:7px; width:6px; height:6px; background:#0a0a0a; border-radius:50%; }
  .total-box { border:2px solid #0a0a0a; border-radius:14px; padding:16px 18px; display:flex; align-items:center; justify-content:space-between; margin-top:20px; }
  .total-label { font-size:14px; font-weight:600; letter-spacing:1px; text-transform:uppercase; }
  .total-value { font-size:31px; font-weight:700; }
  .footnote { font-size:12px; color:#666; margin-top:12px; line-height:1.45; }
  .tag { display:inline-block; border:1px solid #0a0a0a; border-radius:999px; padding:4px 9px; font-size:12px; font-weight:600; margin-top:10px; }
</style>
</head>
<body>
<div class="wake-bar" id="wakeBar">
  <div class="dot"></div><div class="txt" id="wakeTxt">Activando pantalla siempre encendida…</div>
  <button class="wake-btn" id="wakeBtn">Reactivar</button>
</div>
<div class="swipe-hint">← Desliza para recorrer las mejores recetas →</div>
<div class="dots" id="dots"></div>
<div class="carousel" id="carousel"></div>
<script>
const recipes = [
  {name:'Ají Borbón', source:'Externo', origin:'Ecuador', method:'Pour over', device:'Origami Dripper', grind:'20', dose:'10 g', water:'160 ml', temp:'94°C', pours:[['30','Bloom'],['73','V1'],['117','V2'],['160','V3']], score:'77.8', note:'La mejor cata registrada usó click 20. En la observación se indicó que convendría probar click 30 para reducir amargor.'},
  {name:'Catucai', source:'Externo', origin:'Loja · Ecuador · Honey', method:'Pour over', device:'Hario V60', grind:'35', dose:'12.5 g', water:'200 ml', temp:'92°C', pours:[['38','Bloom'],['92','V1'],['146','V2'],['200','V3']], score:'84.6', note:'“Muy bueno, pero siento que puede dar más con un par de semanas adicionales en reposo.”'},
  {name:'Etiopía Yirgacheffe', source:'Externo', origin:'Registrado: USA', method:'Pour over', device:'Hario V60', grind:'35', dose:'12.5 g', water:'200 ml', temp:'93°C', pours:[['38','Bloom'],['92','V1'],['146','V2'],['200','V3']], score:'77.0', note:'“Algo amargo que tapaba la acidez y dulzor, buen aroma.”'},
  {name:'Rosado', source:'Externo', origin:'Colombia · Chapolera', method:'Híbrido', device:'AeroPress', grind:'18', dose:'11.7 g', water:'187 ml', temp:'94°C', pours:[['35','Bloom'],['86','V1'],['136','V2'],['187','V3']], score:'95.0', note:'“Un café excelente… gran fragancia a flores y frutas como frutilla; delicado y elegante.”'},
  {name:'Sudan Rume', source:'Externo', origin:'Quito · Ecuador · Anaeróbico', method:'Híbrido', device:'Hario Switch', grind:'18', dose:'12.5 g', water:'200 ml', temp:'94°C', pours:[['38','Bloom'],['200','Único']], score:'82.3', note:'Se percolaron 100 ml y luego se infusionaron 100 ml.'},
  {name:'Typica Oxy Natural', source:'Externo', origin:'Loja · Ecuador · IKIGAI', method:'Pour over', device:'Origami Dripper', grind:'37', dose:'12.5 g', water:'200 ml*', temp:'88°C', pours:[['38','Bloom'],['92','V1'],['146','V2'],['200','V3']], score:'92.0', note:'*El registro estructurado termina en 200 ml, pero la nota manual dice: bloom sin ducha; luego 90 → 135 → 170 → 240 ml con ducha.'},
  {name:'Blend', source:'Propio', origin:'Loja · Ecuador · Natural', method:'Pour over', device:'Hario V60', grind:'33', dose:'13.1 g', water:'190 ml + 20 ml hielo', temp:'90°C', pours:[['39','Bloom'],['89','V1'],['140','V2'],['190','V3']], score:'80.5', note:'Mezcla real: 7 g del tueste en tostadora + 6.1 g de tueste en canguilera. Filtro plano de Origami usado en V60.'},
  {name:'Sidra Honey', source:'Propio', origin:'Quito · Ecuador · Honey', method:'Híbrido', device:'Hario Switch', grind:'26', dose:'11.8 g', water:'165.2 g', temp:'90°C / 70°C', pours:[['35.4','00:00'],['70.8','00:30'],['165.2','01:15']], score:'80.7', note:'Devil’s Switch de Tetsu Kasuya. La ejecución real se retrasó: el paso de 1:15 llegó a 1:40 y terminó en 3:13.'},
  {name:'Sidra Lavado', source:'Propio', origin:'Loja · Ecuador · Lavado', method:'Pour over', device:'Origami Dripper', grind:'26', dose:'12.5 g', water:'200 ml', temp:'No registrado', pours:[['38','Bloom'],['92','V1'],['146','V2'],['200','V3']], score:'80.8', note:'Observación: “Buena bebida”. La temperatura no consta en esta cata.'},
  {name:'Típica Lavado', source:'Propio', origin:'Quito · Ecuador · Lavado', method:'Pour over', device:'Origami Dripper', grind:'13', dose:'19 g', water:'304 ml', temp:'95°C', pours:[['57','Bloom'],['139','V1'],['222','V2'],['304','V3']], score:'78.8', note:'Mejor cata registrada de Típica lavado.'}
];

const carousel = document.getElementById('carousel');
const dots = document.getElementById('dots');

function card(r){
  return `<section class="card">
    <div class="eyebrow">Mejor receta · ${r.source}</div>
    <h1>${r.name.replace(' ','<br>')}</h1>
    <div class="subtitle">${r.origin}</div>
    <div class="tag">Método: ${r.method}</div>
    <div class="rule"></div>
    <div class="spec-grid">
      <div><div class="spec-label">Dispositivo</div><div class="spec-value">${r.device}</div></div>
      <div><div class="spec-label">Molienda</div><div class="spec-value">Click ${r.grind} <span class="unit">MAVO</span></div></div>
      <div><div class="spec-label">Dosis</div><div class="spec-value">${r.dose}</div></div>
      <div><div class="spec-label">Agua</div><div class="spec-value">${r.water}</div></div>
      <div><div class="spec-label">Temperatura</div><div class="spec-value">${r.temp}</div></div>
      <div><div class="spec-label">Puntuación</div><div class="spec-value">${r.score}</div></div>
    </div>
    <div class="rule"></div>
    <div class="section-title"><span class="num">1</span>Vertidos</div>
    <div class="pours-row"><div class="pours-line"></div>${r.pours.map(p=>`<div class="pour-stop"><div class="pour-dot"></div><div class="pour-ml">${p[0]}ml</div><div class="pour-name">${p[1]}</div></div>`).join('')}</div>
    <div class="rule"></div>
    <div class="section-title"><span class="num">2</span>Nota de cata / ejecución</div>
    <div class="technique-list"><div class="t-item">${r.note}</div></div>
    <div class="total-box"><div class="total-label">Mejor puntuación</div><div class="total-value">${r.score}</div></div>
    <div class="footnote">Selección: mejor puntuación de las catas realizadas por Edgar para este café en RoastLab.</div>
  </section>`;
}

carousel.innerHTML = recipes.map(card).join('');
dots.innerHTML = recipes.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join('');
const dotEls = [...dots.querySelectorAll('span')];
carousel.addEventListener('scroll',()=>{ const idx=Math.round(carousel.scrollLeft/carousel.clientWidth); dotEls.forEach((d,i)=>d.classList.toggle('active',i===idx)); });

let wakeLock=null;
const bar=document.getElementById('wakeBar'), txt=document.getElementById('wakeTxt'), btn=document.getElementById('wakeBtn');
function setStatus(on,msg){bar.classList.toggle('on',on); txt.textContent=msg;}
async function requestWakeLock(){
  if(!('wakeLock' in navigator)){ setStatus(false,'Tu navegador no soporta Wake Lock.'); btn.style.display='none'; return; }
  try { wakeLock=await navigator.wakeLock.request('screen'); setStatus(true,'Pantalla activa mientras preparas'); wakeLock.addEventListener('release',()=>setStatus(false,'Se liberó — toca “Reactivar”')); }
  catch(e){ setStatus(false,'No se pudo activar. Toca “Reactivar”.'); }
}
btn.addEventListener('click',requestWakeLock);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestWakeLock();});
requestWakeLock();
</script>
</body>
</html>
