<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Local - DeepSeek</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #f0f2f5; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            box-sizing: border-box; 
        }
        #config-panel { 
            margin-bottom: 15px; 
            padding: 15px; 
            background: white; 
            border-radius: 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        input[type="password"], select { 
            width: 100%; 
            padding: 10px; 
            margin-top: 8px; 
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box; 
        }
        input[type="password"] { font-family: monospace; }
        select { font-size: 14px; cursor: pointer; }
        
        #chat-container { 
            flex: 1; 
            background: white; 
            border-radius: 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        #messages { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .message { 
            padding: 12px 16px; 
            border-radius: 15px; 
            max-width: 85%; 
            line-height: 1.5; 
            word-wrap: break-word;
        }
        .user-message { 
            background: #0b93f6; 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 4px; 
        }
        .bot-message { 
            background: #e5e5ea; 
            color: black; 
            align-self: flex-start; 
            border-bottom-left-radius: 4px; 
        }
        #input-area { 
            display: flex; 
            padding: 15px; 
            background: #fff; 
            border-top: 1px solid #eee; 
            gap: 10px;
        }
        #user-input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 20px; 
            outline: none; 
            font-size: 16px;
        }
        #send-btn { 
            padding: 10px 25px; 
            background: #0b93f6; 
            color: white; 
            font-weight: bold;
            border: none; 
            border-radius: 20px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        #send-btn:hover { background: #0077ce; }
        #send-btn:disabled { background: #b0c4de; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="config-panel">
    <label for="api-key"><strong>🔑 API Key de DeepSeek:</strong></label>
    <input type="password" id="api-key" placeholder="Pega aquí tu key (empieza con sk-...)" />
    
    <label for="model-selector" style="display:block; margin-top:15px;"><strong>🧠 Selecciona el Modelo:</strong></label>
    <select id="model-selector">
        <option value="deepseek-chat">⚡ V4 Flash (Rápido y económico para tareas de rutina)</option>
        <option value="deepseek-reasoner">🔬 V4 Pro (Análisis profundo para telemetría y catas)</option>
    </select>
</div>

<div id="chat-container">
    <div id="messages">
        <div class="message bot-message">¡Hola! Ingresa tu API Key, selecciona el modelo que prefieras usar hoy y cuéntame en qué te ayudo.</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Escribe tu mensaje aquí..." autocomplete="off" />
        <button id="send-btn">Enviar</button>
    </div>
</div>

<script>
    const apiKeyInput = document.getElementById('api-key');
    const modelSelector = document.getElementById('model-selector');
    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    let conversationHistory = [
        { role: "system", content: "Eres un asistente experto. Si se te piden análisis complejos, razona paso a paso." }
    ];

    if (localStorage.getItem('deepseek_key')) {
        apiKeyInput.value = localStorage.getItem('deepseek_key');
    }
    
    // Guardar preferencia de modelo para que no tengas que cambiarlo cada vez
    if (localStorage.getItem('deepseek_model')) {
        modelSelector.value = localStorage.getItem('deepseek_model');
    }

    apiKeyInput.addEventListener('input', () => {
        localStorage.setItem('deepseek_key', apiKeyInput.value.trim());
    });
    
    modelSelector.addEventListener('change', () => {
        localStorage.setItem('deepseek_model', modelSelector.value);
    });

    function addMessage(role, content) {
        const div = document.createElement('div');
        div.className = `message ${role === 'user' ? 'user-message' : 'bot-message'}`;
        div.textContent = content;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        const apiKey = apiKeyInput.value.trim();
        const selectedModel = modelSelector.value;

        if (!text) return;
        if (!apiKey) {
            alert("⚠️ Por favor, ingresa tu API Key.");
            apiKeyInput.focus();
            return;
        }

        addMessage('user', text);
        conversationHistory.push({ role: "user", content: text });
        
        userInput.value = '';
        sendBtn.disabled = true;
        sendBtn.textContent = 'Pensando...';

        try {
            const response = await fetch('https://api.deepseek.com/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: selectedModel, // ¡AQUÍ ES DONDE PASA LA MAGIA!
                    messages: conversationHistory
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || `Error HTTP: ${response.status}`);
            }

            const data = await response.json();
            const botReply = data.choices[0].message.content;

            addMessage('assistant', botReply);
            conversationHistory.push({ role: "assistant", content: botReply });

        } catch (error) {
            console.error(error);
            addMessage('assistant', "❌ Error de conexión: " + error.message);
            conversationHistory.pop(); 
        } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = 'Enviar';
            userInput.focus();
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
