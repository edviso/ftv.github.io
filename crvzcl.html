<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14110E">
<title>Cervecería · Control integral</title>
<style>
:root{
  --bg:#14110E; --surface:#1E1A16; --surface2:#262019; --line:#332B23;
  --text:#F2EDE4; --muted:#A2968A; --dim:#7A6E62;
  --amber:#E8A33D; --hop:#8FB25A; --alert:#D9694E; --cold:#6FA8C7;
  --r:12px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.45;
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
button:active{opacity:.7}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- Header ---------- */
header{
  display:flex;align-items:center;gap:8px;padding:10px 14px 8px;
  border-bottom:1px solid var(--line);background:var(--bg);flex-shrink:0;
}
.brand{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.brand small{display:block;font-size:10px;letter-spacing:.08em;color:var(--dim);font-weight:600}
.hbtns{margin-left:auto;display:flex;gap:6px}
.hbtn{
  border:1px solid var(--line);border-radius:8px;padding:5px 9px;
  font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;
}

/* ---------- Timer bar ---------- */
#timerbar{
  display:none;align-items:center;gap:10px;padding:8px 14px;
  background:var(--surface2);border-bottom:1px solid var(--line);flex-shrink:0;
}
#timerbar.on{display:flex}
#tb-time{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-.02em}
#tb-label{font-size:11px;color:var(--muted);flex:1;line-height:1.2}
#tb-stop{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;color:var(--alert)}
#timerbar.ring{background:#3A2018;animation:pulse .9s infinite}
@keyframes pulse{50%{background:#5A2C1E}}
@media (prefers-reduced-motion:reduce){#timerbar.ring{animation:none}}

/* ---------- Main ---------- */
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 22px;-webkit-overflow-scrolling:touch}

/* ---------- Nav ---------- */
nav{
  display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);
  background:var(--surface);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);
}
nav button{padding:9px 1px 8px;font-size:9px;font-weight:700;color:var(--dim);letter-spacing:.02em}
nav button b{display:block;font-size:16px;font-weight:400;line-height:1.2;margin-bottom:1px}
nav button.on{color:var(--amber)}

/* calendario */
.fase{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:12px}
.fbar{width:6px;height:26px;border-radius:3px;flex-shrink:0}
.fase .fn{flex:1;color:var(--muted)}
.fase .fd{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
.hoy{border-color:var(--amber)}
.hoy .stitle{color:var(--amber)}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700}
.b-ok{background:#1E2E14;color:var(--hop)}
.b-warn{background:#3A2318;color:var(--alert)}
.b-mid{background:#33290F;color:var(--amber)}

/* ---------- Blocks ---------- */
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
h1{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:3px}
h2{font-size:15px;font-weight:700;margin-bottom:6px}
.sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card.tap{display:block;width:100%;text-align:left}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.tiny{font-size:11px}
.mini{font-size:12px}
.warn{color:var(--alert)}
.ok{color:var(--hop)}
hr{border:none;border-top:1px solid var(--line);margin:12px 0}

.chip{
  display:inline-block;border:1px solid var(--line);border-radius:999px;
  padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--muted)
}
.chip.a{color:var(--amber);border-color:#4A3820}
.chip.g{color:var(--hop);border-color:#37421F}
.chip.c{color:var(--cold);border-color:#22404E}

/* color de cerveza: firma visual */
/* La muestra va sobre un marco claro: contra el fondo oscuro de la app
   un Stout se confundiría con el propio fondo. Igual que las cartas de
   color cerveceras, que siempre se leen contra blanco. */
.swatch{width:34px;height:44px;border-radius:6px;flex-shrink:0;
  border:3px solid #FFFFFF;background-clip:padding-box;
  box-shadow:inset 0 -7px 10px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.45)}
.swatch.sm{width:15px;height:19px;border-radius:4px;border-width:2px}

.btn{
  display:block;width:100%;text-align:center;background:var(--amber);color:#1A1206;
  border-radius:10px;padding:12px;font-weight:800;font-size:14px;letter-spacing:.01em;margin-top:10px
}
.btn.sec{background:none;border:1px solid var(--line);color:var(--text);font-weight:700}
.btn.danger{background:none;border:1px solid #4A2A22;color:var(--alert)}
.btn.sm{padding:9px;font-size:12px}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

label.f{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:10px 0 4px}
input,select,textarea{
  width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:9px;
  padding:10px;font-family:var(--mono);font-size:14px
}
input:focus,select,textarea:focus{outline:none;border-color:var(--amber)}
textarea{font-family:var(--sans);resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

.stepper{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:4px}
.stepper button{width:34px;height:32px;font-size:18px;font-weight:700;color:var(--amber);border-radius:6px;background:var(--surface)}
.stepper span{flex:1;text-align:center;font-family:var(--mono);font-weight:700}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:right;font-weight:800;padding:0 0 6px}
th:first-child{text-align:left}
td{padding:5px 0;border-top:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td:first-child{text-align:left;font-family:var(--sans)}

/* pasos de cocción */
.step{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:none}
.stepno{
  width:26px;height:26px;border-radius:50%;border:1px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--dim)
}
.step.done .stepno{background:var(--hop);border-color:var(--hop);color:#16200A}
.step.done .stitle{color:var(--dim);text-decoration:line-through}
.stitle{font-weight:700;font-size:14px;margin-bottom:2px}
.sbody{font-size:12.5px;color:var(--muted);line-height:1.5}
.sbody b{color:var(--text);font-family:var(--mono);font-weight:700}
.stimer{margin-top:7px;border:1px solid #4A3820;color:var(--amber);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:800;letter-spacing:.05em}

/* etapas de fermentación */
.stage{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.stbar{flex:1}
.bar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hop);border-radius:3px;transition:width .5s}
.bar.big{height:8px}
.bar.big i{background:var(--amber)}
.stage.now .stname{color:var(--amber);font-weight:800}
.stname{font-size:13px;font-weight:600}
.stdot{width:8px;height:8px;border-radius:50%;background:var(--line);flex-shrink:0}
.stage.done .stdot{background:var(--hop)}
.stage.now .stdot{background:var(--amber);box-shadow:0 0 0 3px rgba(232,163,61,.2)}

/* chat */
main.chatmode{overflow:hidden;padding:14px 14px 0}
#chatwrap{display:flex;flex-direction:column;height:100%;min-height:0}
#chathead{flex-shrink:0}
#msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 0 8px;-webkit-overflow-scrolling:touch}
.msg{margin-bottom:14px;font-size:14px;line-height:1.55}
.msg.u{background:var(--surface2);border:1px solid var(--line);border-radius:12px 12px 4px 12px;padding:10px 12px;margin-left:24px}
.msg.a{border-left:2px solid var(--amber);padding:2px 0 2px 11px}
.msg.a b{color:var(--amber)}
.msg pre{white-space:pre-wrap;font-family:inherit}
.copy{
  display:inline-flex;align-items:center;gap:7px;margin-top:10px;min-height:40px;
  padding:9px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);
  font-size:12px;font-weight:700;color:var(--muted)
}
#chatform{display:flex;gap:8px;align-items:flex-end;flex-shrink:0;
  padding:9px 0 calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}

/* indicador de carga: vaso con burbujas subiendo */
.pensando{display:flex;align-items:center;gap:10px}
.vaso{width:26px;height:34px;flex-shrink:0;overflow:visible}
.v-cuerpo{fill:none;stroke:var(--dim);stroke-width:1.3;stroke-linejoin:round}
.v-liquido{fill:var(--amber);opacity:.5}
.v-espuma{fill:#F5EDDD;opacity:.85}
.burbuja{fill:#FFF6E0;opacity:0;animation:sube 1.9s ease-in infinite}
.b2{animation-delay:.45s} .b3{animation-delay:.9s} .b4{animation-delay:1.35s}
@keyframes sube{
  0%{transform:translateY(0);opacity:0}
  15%{opacity:.9}
  75%{opacity:.8}
  100%{transform:translateY(-19px);opacity:0}
}
.pensando span{animation:latido 1.6s ease-in-out infinite}
@keyframes latido{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){
  .burbuja{animation:none;opacity:.7}
  .pensando span{animation:none}
}
#chatin{flex:1;max-height:110px}
#send{background:var(--amber);color:#1A1206;border-radius:10px;padding:0 16px;height:44px;font-weight:800;font-size:18px}
.qbtn{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:11.5px;color:var(--muted);margin:0 6px 6px 0;white-space:nowrap}
.qrow{display:flex;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.qrow::-webkit-scrollbar{display:none}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,6,4,.72);display:flex;align-items:flex-end;z-index:50}
.sheet{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:16px 14px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:var(--surface2);border:1px solid var(--line);
  color:var(--text);padding:9px 14px;border-radius:999px;font-size:12.5px;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.empty{text-align:center;color:var(--dim);font-size:13px;padding:30px 10px;line-height:1.6}
</style>
</head>
<body>

<header>
  <div class="brand">Cervecería<small id="hsub">control integral</small></div>
  <div class="hbtns">
    <button class="hbtn" onclick="openLog()">LOG</button>
    <button class="hbtn" onclick="go('ajustes')">AJUSTES</button>
  </div>
</header>

<div id="timerbar">
  <div id="tb-time">00:00</div>
  <div id="tb-label"></div>
  <button id="tb-stop" onclick="stopTimer()">Detener</button>
</div>

<main id="view"></main>

<nav id="nav">
  <button data-t="insumos" onclick="go('insumos')"><b>▤</b>Insumos</button>
  <button data-t="recetas" onclick="go('recetas')"><b>◈</b>Recetas</button>
  <button data-t="plan"    onclick="go('plan')"><b>▦</b>Plan</button>
  <button data-t="coccion" onclick="go('coccion')"><b>◐</b>Cocción</button>
  <button data-t="lotes"   onclick="go('lotes')"><b>◉</b>Lotes</button>
  <button data-t="chat"    onclick="go('chat')"><b>✦</b>Chat</button>
</nav>

<script>
/* ============================================================
   CERVECERÍA — app de un solo archivo
   Datos en localStorage. Sin dependencias externas.
   ============================================================ */

const CAMBIOS = [
  {f:"2026-08-11 12:20 (Ecuador)", t:"Versión 2.9. El chat muestra ahora un vaso de cerveza con burbujas subiendo mientras la IA responde, en lugar del texto suelto."},
  {f:"2026-08-11 00:10 (Ecuador)", t:"Versión 2.8. Las recetas admiten un clarificante con su cantidad; aparece en la ficha, se edita en el editor, entra como paso del hervido del Día 2 en la guía de cocción y pasa al contexto del chat. La réplica del Lote 53 lleva 2 g de Irish Moss."},
  {f:"2026-08-10 23:40 (Ecuador)", t:"Versión 2.7. Corregida una sobrecorrección: la regla anterior llevó al modelo a decir que el amargor BAJA al concentrar, cuando sube. Añadidas constantes de cálculo rápido del equipo (100 g de azúcar = 2,4 puntos de OG en 16 L; minutos extra de hervido = litros x 32,4) para que deje de estimar, y ampliada la comprobación BJCP a todos los parámetros, no solo el ABV."},
  {f:"2026-08-10 22:10 (Ecuador)", t:"Versión 2.6. Corregido el botón Copiar todo: la cabecera del chat no se redibujaba al enviar el primer mensaje, así que los botones no aparecían hasta cambiar de pestaña. Tres reglas nuevas tras probar preguntas sobre la Stout: no escalar IBU ni color proporcionalmente al cambiar el volumen, usar la tasa real de evaporación del equipo (1,85 L/h) para calcular tiempos de hervido, y distinguir el número de receta del orden de elaboración."},
  {f:"2026-08-10 21:20 (Ecuador)", t:"Versión 2.5. Tres ajustes al contexto salidos de una prueba con la American Amber: se advierte que la eficiencia del 72,5 % está medida con 13 L de maceración y 7 L de lavado y que cae si se lava menos (el modelo calculaba OG altas suponiéndola constante); obligación de comparar todo cambio de receta contra el rango BJCP del estilo y avisar si lo saca de estilo; y obligación de revisar los puntos de riesgo cuando un cambio suba la densidad o el estrés de la levadura."},
  {f:"2026-08-10 20:25 (Ecuador)", t:"Versión 2.4. El marco de la muestra pasa a blanco puro y 3 px, para que el color se lea igual que en la carta del manual BJCP."},
  {f:"2026-08-10 20:05 (Ecuador)", t:"Versión 2.3. La muestra de color va ahora enmarcada en claro: sobre el fondo casi negro de la app las cervezas oscuras se confundían con el propio fondo y el ajuste anterior no se apreciaba. Es el mismo principio de las cartas de color cerveceras, que se leen contra blanco."},
  {f:"2026-08-10 19:45 (Ecuador)", t:"Versión 2.2. Ajustado el tramo oscuro del color: por encima de SRM 20 la tabla de laboratorio muestra la cerveza a contraluz y se separa del aspecto real en el vaso. Ahora se oscurece progresivamente para coincidir con la carta visual BJCP, donde SRM 30 ya es marrón oscuro y SRM 37 es negro. Porter y Stout dejan de verse rojizas."},
  {f:"2026-08-10 19:30 (Ecuador)", t:"Versión 2.1. Corregido el color de las muestras: la fórmula exponencial dejaba las cervezas claras y ámbar demasiado rojas (le faltaba verde) y hacía que la Amber, la Märzen, la Irish Red y la Munich Amber se vieran casi iguales entre sí. Ahora se interpola sobre la tabla SRM de referencia. Suavizado el brillo interior de la muestra, que aplanaba las diferencias."},
  {f:"2026-08-10 15:10 (Ecuador)", t:"Versión 2.0. Contexto ampliado: tabla con los rangos BJCP 2021 de los diez estilos del plan (el modelo los recordaba mal), guía de defectos ligada al equipo y al clima de Guayaquil, y prohibición de suponer perfil de agua. La bitácora de cada lote pasa ahora completa al chat (8 notas en vez de 3). Nueva regla: distinguir lo que viene del contexto de lo que sale de su memoria, y preferir decir que no sabe antes que rellenar."},
  {f:"2026-08-10 14:30 (Ecuador)", t:"Versión 1.9. Maceración de la réplica del Lote 53 subida a 68 °C para recuperar cuerpo y espuma. Contexto del chat reforzado: nuevo bloque de experiencia y restricciones (lote aprobado, amargor real mayor que el calculado por la isomerización nocturna, historial de avena y trigo, tope de compra de 5 kg) y seis reglas nuevas contra los fallos detectados: no contradecirse dentro de la conversación, no negar riesgos clásicos, cuantificar todo cambio de lúpulo antes de proponerlo, no mezclar el veredicto de la app con el rango BJCP, no tocar recetas ya aprobadas y no sugerir insumos que sobrarían."},
  {f:"2026-08-10 03:05 (Ecuador)", t:"Versión 1.8. Corregido el botón Aplicar reparto a cero: solo reponía granos y lúpulos, dejando el nombre, el volumen y los objetivos viejos. Ahora repone la receta completa."},
  {f:"2026-08-10 02:40 (Ecuador)", t:"Versión 1.7. La receta 1 pasa a ser la réplica del Lote 53 ya probado: 17 L, 3600 g de Pilsen y 300 g de Cara 20, Simcoe 7 g @30 y Cascade 13 g al whirlpool. Rebalanceo del resto para que las cuatro maltas sigan en cero: 100 g más de Pilsen en la APA, y 100 g menos de Cara 20 con 100 g más de Pilsen en Märzen, Irish Red y Munich Amber. Ajustado el tueste de cada receta al nuevo grano."},
  {f:"2026-08-10 02:05 (Ecuador)", t:"Versión 1.6. Botón Copiar todo en la cabecera del chat: copia la conversación completa con fecha y hora, además del botón de copiar de cada respuesta."},
  {f:"2026-08-10 01:30 (Ecuador)", t:"Versión 1.5. Nueva pestaña Plan: calendario de los 8 lotes repartiendo las neveras en el tiempo, con la cerveza siempre bajo control de temperatura (fermentación, carbonatación a 21-22 y maduración a 11-12, seguidas). Configurable el número de neveras y fermentadores, las duraciones y la fecha de inicio. Muestra qué toca hoy, la próxima cocción, la edad que tendrá la malta en cada lote y hasta cuándo alcanza la vida útil de cada insumo. El chat recibe el calendario ya calculado."},
  {f:"2026-08-10 00:40 (Ecuador)", t:"Versión 1.4. Alfa-ácidos reales cargados: Cascade 8,9 % y Simcoe 13,7 %. Con esos valores las recetas quedaban 50-80 % por encima del amargor buscado, así que se recalcularon las adiciones de Simcoe: las ocho vuelven a caer dentro de su rango de IBU. El Cascade del whirlpool no se toca. Sobran 304 g de Simcoe."},
  {f:"2026-08-10 00:05 (Ecuador)", t:"Versión 1.3. Reparto balanceado: las 8 recetas dejan las cuatro maltas exactamente en cero (Pilsen 19.500, Munich 3.500, Pale Ale 4.400, Cara 20 4.750). Siete lotes de 4.000 g y el #8 de 4.150 g. Cada receta que lo necesita lleva su porción de Pilsen tostada en línea aparte, con su color propio, descontándose igual del stock de Pilsen. Botón en Ajustes para aplicar el reparto sobre datos ya guardados."},
  {f:"2026-08-09 23:20 (Ecuador)", t:"Versión 1.2. Calculadora propia en JavaScript: OG por extracto y eficiencia, IBU por Tinseth (contando los dos tramos del hervido y el whirlpool), color por Morey y FG/ABV por atenuación. Cada receta muestra lo calculado junto al objetivo y marca las diferencias. Fichas editables de maltas (PPG y °L) y lúpulos (% alfa) en Insumos; eficiencia, volumen de hervido y factor de whirlpool en Ajustes. El chat ahora recibe los números y los saldos ya calculados, con instrucción de no rehacer la aritmética y de cuadrar toda tabla antes de responder."},
  {f:"2026-08-09 22:41 (Ecuador)", t:"Versión 1.1. Chat rehecho: los mensajes tienen su propio scroll y el campo de escritura ya no tapa el último mensaje. Botón Copiar más grande. Se descartan los bloques de razonamiento del modelo (antes se colaba su borrador en vez de la respuesta), se limita el pensamiento y se avisa si la respuesta se corta por falta de espacio. Botón Limpiar conversación."},
  {f:"2026-08-09 18:44 (Ecuador)", t:"Versión 1.0. App nueva: insumos con saldo proyectado, 8 recetas cargadas, editor de recetas, guía de cocción en 2 días con temporizadores y avisos de lúpulo, seguimiento de fermentación por lote y chat con Gemini (BJCP + equipo propio en contexto)."}
];

const EQUIPO = `EQUIPO DEL CERVECERO (Edgar, Guayaquil, Ecuador) — 3 recipientes:
- Olla 1 (20 L): calentamiento de agua, hornilla eléctrica con control de temperatura por relé (setpoint fijo).
- Olla 2 (20 L): macerador, hornilla eléctrica con control de temperatura por relé (setpoint mínimo y máximo, banda típica de 1 °C). Maceración mixta: fondo falso metálico perforado que deja ~2 cm de cámara bajo la funda de maceración; el grano va dentro de la funda. Con este arreglo no se atasca al recircular y filtra bien.
- Olla 3 (17 L): hervidor, hornilla a gas de control manual.
- Bomba 1: lleva agua caliente de Olla 1 al macerador; también impulsa el agua helada al serpentín durante el enfriado.
- Bomba 2: recirculado del mosto en maceración; secundariamente trasvasa el mosto macerado al hervidor.
- Serpentín de cobre de casi toda la altura del hervidor, con tapa por donde salen las dos puntas.
- Enfriado (método propio): tras el hervido llena la Olla 1 con hielo y algo de agua; la Bomba 1 mete agua helada al serpentín y el retorno cae en la misma Olla 1. En ~30 min el mosto llega a temperatura de siembra y aún quedan hielos flotando. No desperdicia agua: al día siguiente vuelve a congelar esa misma agua en moldes y la reutiliza durante ~1 año.
- Proceso partido en 2 días (para no hacer 8 horas seguidas): DÍA 1 (~4 h, termina cerca de las 22:00) hasta el hervido de ~55 min; tapa el hervidor bien sellado. DÍA 2 a las 08:00: hervido corto de 10 min para eliminar cualquier patógeno y los DMS formados, whirlpool, enfriado y siembra. Lo ha hecho varias veces y la cerveza sale muy bien.
- Volumen habitual: 16 L por lote. Levadura: ale limpia seca, ~11 g por lote.`;

/* Tabla SRM de referencia (1 a 40), interpolada. Sustituye a la
   aproximación exponencial anterior, que dejaba las cervezas
   claras y ámbar demasiado rojas por falta de verde. */
const SRM_REF=["FFE699","FFD878","FFCA5A","FFBF42","FBB123","F8A733","F39C00","EA8F00","E58500","DE7C00",
"D77200","CF6900","CB6200","C35900","BB5100","B54C00","B04500","A63E00","A13700","9B3200",
"952D00","8E2900","882300","821E00","7B1A00","771900","701400","6A0E00","660D00","5E0B00",
"5A0A02","560903","520907","4C0505","470606","440607","3F0708","3B0607","3A070B","36080A"];
function ebcColor(ebc){
  const srm=Math.max(0.5,(Number(ebc)||4)*0.508);
  const hex=i=>{const s=SRM_REF[Math.max(0,Math.min(39,i))];
    return [parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)];};
  let c;
  if(srm>=40) c=hex(39);
  else{
    const lo=Math.floor(srm)-1, t=srm-Math.floor(srm), a=hex(lo), b=hex(lo+1);
    c=[0,1,2].map(i=>a[i]+(b[i]-a[i])*t);
  }
  /* Por encima de SRM 20 la tabla de laboratorio (cerveza a contraluz)
     se separa del aspecto real en el vaso: la carta BJCP muestra marrón
     oscuro hacia 30 y negro hacia 37. Se oscurece progresivamente. */
  if(srm>20){ const k=Math.max(0.22,1-(srm-20)*0.035); c=c.map(v=>v*k); }
  return `rgb(${c.map(v=>Math.round(Math.min(255,Math.max(0,v)))).join(",")})`;
}
function abvCalc(og,fg){ if(!og||!fg) return null; return ((og-fg)*131.25); }

/* ============================================================
   CALCULADORA — OG por eficiencia, IBU por Tinseth, color por Morey
   Todo se calcula aquí, en JavaScript. La IA recibe estos números ya
   hechos: interpreta, no hace la aritmética.
   ============================================================ */
function fichaMalta(g){
  const n=typeof g==="string"?g:g.n;
  const m=DB.insumos.maltas.find(x=>x.n===n);
  const o={ppg:(m&&m.ppg!=null)?m.ppg:35, lov:(m&&m.lov!=null)?m.lov:5, hay:!!m};
  if(typeof g==="object"){ if(g.ppg!=null) o.ppg=g.ppg; if(g.lov!=null){o.lov=g.lov; o.hay=true;} }
  return o;
}
function fichaLupulo(n){
  const h=DB.insumos.lupulos.find(x=>x.n===n);
  return {aa:(h&&h.aa!=null)?h.aa:6, hay:!!h};
}
function calc(r){
  const V=Number(r.litros)||16;
  const ef=(Number(DB.cfg.eficiencia)||72.5)/100;
  const vH=Number(DB.cfg.vHervido)||18;
  const fWP=DB.cfg.factorWP!=null?Number(DB.cfg.factorWP):0.25;
  const avisos=[];

  /* Extracto → puntos de gravedad. PPG × 8,3454 = puntos·L/kg */
  let ptsL=0, mcuSum=0, granoTotal=0;
  r.granos.forEach(g=>{
    const f=fichaMalta(g), peso=Number(g.g||0);
    if(!f.hay) avisos.push(`${g.n}: sin ficha en Insumos, se asumió 35 PPG / 5 °L`);
    ptsL += peso/1000 * f.ppg*8.3454 * ef;
    mcuSum += peso*f.lov;
    granoTotal += peso;
  });
  const ogPts = ptsL/V;
  const og = 1 + ogPts/1000;

  /* Color: MCU = Σ(g × °L) × 0,008345 / L ; SRM = 1,4922 × MCU^0,6859 (Morey) */
  const mcu = mcuSum*0.008345/V;
  const srm = mcu>0 ? 1.4922*Math.pow(mcu,0.6859) : 0;
  const ebc = srm*1.97;

  /* Tinseth. Gravedad media del hervido a partir del extracto total. */
  const gb = 1 + (ogPts*V/vH)/1000;
  const bigness = 1.65*Math.pow(0.000125, gb-1);
  const det=[]; let ibu=0;
  r.lupulos.forEach(h=>{
    const f=fichaLupulo(h.n), peso=Number(h.g||0);
    if(!f.hay) avisos.push(`${h.n}: sin % de alfa-ácidos, se asumió 6 %`);
    let t, factor=1, txt;
    if(h.min==="wp"){
      t=parseInt(String(r.proc.reposo))||20; factor=fWP;
      txt=`whirlpool ${t} min a ${r.proc.wpTemp} °C (${Math.round(fWP*100)} % de utilización)`;
    }else{
      const marca=Math.max(0, DB.cfg.boil1-Number(h.min));
      t=(DB.cfg.boil1-marca)+DB.cfg.boil2;
      txt=`entra en el minuto ${marca} del Día 1 → ${t} min efectivos (incluye los ${DB.cfg.boil2} del Día 2)`;
    }
    const util=bigness*((1-Math.exp(-0.04*t))/4.15)*factor;
    const mgl=(f.aa/100)*peso*1000/V;
    const x=util*mgl; ibu+=x;
    det.push({n:h.n,g:peso,aa:f.aa,t:t,util:util,ibu:x,txt:txt});
  });

  /* Atenuación aparente típica de ale seca limpia: 75–82 % */
  const fgAlta = og - (og-1)*0.75, fgBaja = og - (og-1)*0.82;
  return {V,ef,vH,og,ogPts,ebc,srm,mcu,ibu,det,avisos,granoTotal,gb,
          fgMin:fgBaja, fgMax:fgAlta,
          abvMin:(og-fgAlta)*131.25, abvMax:(og-fgBaja)*131.25};
}
function delta(calcV,min,max,tol){
  if(min==null) return "";
  const lo=max==null?min:Math.min(min,max), hi=max==null?min:Math.max(min,max);
  if(calcV>=lo-(tol||0) && calcV<=hi+(tol||0)) return `<span class="ok">coincide</span>`;
  return `<span class="warn">${calcV>hi?"↑":"↓"} objetivo ${lo===hi?lo:lo+"–"+hi}</span>`;
}

let T=null, ringing=false, ac=null, wake=null;
function startTimer(min,label,avisos){
  T={end:Date.now()+min*60000,label:label,total:min*60000,avisos:(avisos||[]).map(a=>({...a,fired:false}))};
  ringing=false; $("#timerbar").classList.remove("ring");
  keepAwake(); tick();

function stopTimer(){ T=null; ringing=false; $("#timerbar").classList.remove("ring","on"); if(ac){try{ac.close()}catch(e){}; ac=null;} }
function tick(){
  const bar=$("#timerbar");
  if(!T){bar.classList.remove("on");return;}
  bar.classList.add("on");
  let left=T.end-Date.now();
  if(left<=0){
    left=0;
    if(!ringing){ringing=true;bar.classList.add("ring");alarma();}
    $("#tb-time").textContent="00:00";
    $("#tb-label").innerHTML="<b>Listo:</b> "+esc(T.label);
  }else{
    const s=Math.round(left/1000), m=Math.floor(s/60), ss=s%60;
    $("#tb-time").textContent=String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");
    $("#tb-label").textContent=T.label;
    const minLeft=left/60000;
    T.avisos.forEach(a=>{
      if(!a.fired && minLeft<=a.at){ a.fired=true; beep(2); toast("⏱ "+a.txt,5000); }
    });
  }
}
setInterval(tick,500);
function beep(n){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<(n||1);i++){
      const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*0.28;
      o.frequency.value=880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.22); o.start(t); o.stop(t+0.24);
    }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([180,90,180]);
}
function alarma(){ beep(4); setTimeout(()=>{if(ringing)beep(4)},1600); }
async function keepAwake(){
  try{ if("wakeLock" in navigator && !wake){ wake=await navigator.wakeLock.request("screen");
    wake.addEventListener("release",()=>{wake=null}); } }catch(e){}
}

  })();

  return `

function editarInsumos(tipo){
  const arr=DB.insumos[tipo], u=tipo==="levadura"?"sobres":"g";
  const extra=(x,i)=>{
    if(tipo==="maltas") return `<div class="grid2">
      <div><label class="f">Extracto (PPG)</label><input inputmode="decimal" id="pp${i}" value="${x.ppg}"></div>
      <div><label class="f">Color (°L)</label><input inputmode="decimal" id="lv${i}" value="${x.lov}"></div></div>`;
    if(tipo==="lupulos") return `<label class="f">Alfa-ácidos (%)</label><input inputmode="decimal" id="aa${i}" value="${x.aa}">`;
    return "";
  };
  sheet(`Stock y fichas de ${tipo}`,`
    ${arr.map((x,i)=>`<div style="padding-bottom:8px;border-bottom:1px solid var(--line)">
      <label class="f">${esc(x.n)} — cantidad (${u})</label>
      <input inputmode="decimal" id="ins${i}" value="${x.g!=null?x.g:x.sobres}">
      ${extra(x,i)}</div>`).join("")}
    <label class="f">Agregar otro (nombre)</label><input id="insNew" placeholder="opcional">
    <label class="f">Cantidad (${u})</label><input inputmode="decimal" id="insNewQ" placeholder="0">
    ${tipo==="maltas"?`<div class="tiny dim" style="margin-top:6px">El color en °L manda sobre el EBC calculado. Si tu Cara 20 está rotulada en EBC, divide entre 1,97 para pasarla a °L.</div>`:""}
    ${tipo==="lupulos"?`<div class="tiny dim" style="margin-top:6px">El % de alfa-ácidos viene impreso en el paquete y cambia con cada cosecha. Es el dato que más mueve el IBU.</div>`:""}
    <button class="btn" onclick="guardarInsumos('${tipo}')">Guardar</button>`);
}
function guardarInsumos(tipo){
  const arr=DB.insumos[tipo], k=tipo==="levadura"?"sobres":"g";
  arr.forEach((x,i)=>{
    const v=parseFloat($("#ins"+i).value); if(!isNaN(v)) x[k]=v;
    if(tipo==="maltas"){
      const p=parseFloat($("#pp"+i).value), l=parseFloat($("#lv"+i).value);
      if(!isNaN(p)) x.ppg=p; if(!isNaN(l)) x.lov=l;
    }
    if(tipo==="lupulos"){ const a=parseFloat($("#aa"+i).value); if(!isNaN(a)) x.aa=a; }
  });
  const nn=$("#insNew").value.trim(), nq=parseFloat($("#insNewQ").value);
  if(nn && !isNaN(nq)){
    const o={n:nn}; o[k]=nq;
    if(tipo==="maltas"){o.ppg=35;o.lov=5;} if(tipo==="lupulos") o.aa=6;
    arr.push(o);
  }
  save(); closeSheet(); render(); toast("Guardado");
}

function adoptarCalculo(id){
  const r=DB.recetas.find(x=>x.id===id), K=calc(r);

  r.og=Math.round(K.og*1000)/1000;
  r.fgMin=Math.round(K.fgMin*1000)/1000; r.fgMax=Math.round(K.fgMax*1000)/1000;

function parseLineas(txt,campos){
  return txt.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(",").map(s=>s.trim());
    const o={n:p[0]||"?"};
    if(campos>=2) o.g=parseFloat(p[1])||0;
    if(campos===3) o.min=(p[2]||"").toLowerCase()==="wp"?"wp":(parseFloat(p[2])||0);
    if(campos===2 && p[2]!=null && p[2]!==""){ const v=parseFloat(p[2]); if(!isNaN(v)) o.lov=v; }
    return o;
  });
}
/* Datos guardados en 1.0/1.1: separar la malta tostada en su propia línea */
DB.recetas.forEach(r=>{
  const i=r.granos.findIndex(g=>/tostad/i.test(g.nota||"") && g.lov==null);
  if(i<0) return;
  const g=r.granos[i], m=(g.nota||"").match(/(\d+)\s*g/);
  const t=m?parseInt(m[1]):0;
  if(t>0 && t<Number(g.g)){
    g.g=Number(g.g)-t; delete g.nota;
    r.granos.splice(i+1,0,{n:g.n,g:t,lov:150,ppg:33,nota:"tostada en casa"});
  }
});
function guardarReceta(id){
  const r=DB.recetas.find(x=>x.id===id);
  r.nombre=$("#e_nom").value.trim()||r.nombre;
  r.bjcp=$("#e_bjcp").value.trim();
  r.litros=parseFloat($("#e_lit").value)||r.litros;
  r.og=parseFloat($("#e_og").value)||r.og;
  r.ebcMin=parseFloat($("#e_ebc1").value); r.ebcMax=parseFloat($("#e_ebc2").value);
  r.ibuMin=parseFloat($("#e_ibu1").value); r.ibuMax=parseFloat($("#e_ibu2").value);
  const gs=parseLineas($("#e_gr").value,2); if(gs.length) r.granos=gs;
  const ls=parseLineas($("#e_lu").value,3); if(ls.length) r.lupulos=ls;
  const cl=$("#e_cl").value.trim();
  if(cl){const q=cl.split(","); r.clarificante={n:(q[0]||"").trim()||"Irish Moss",g:parseFloat(q[1])||2};}
  else delete r.clarificante;
  r.notas=$("#e_no").value.trim();
  save(); closeSheet(); render(); toast("Receta guardada");
}
function borrarReceta(id){

function pasosDia1(r){
  const b1=DB.cfg.boil1;
  const hopsHervido=r.lupulos.filter(h=>h.min!=="wp")
    .map(h=>({...h,marca:Math.max(0,b1-Number(h.min))})).sort((a,b)=>a.marca-b.marca);
  const avisos=hopsHervido.map(h=>({at:b1-h.marca,txt:`${h.n} ${h.g} g (minuto ${h.marca})`}))
    .concat([{at:b1-r.proc.topupMin,txt:`Minuto ${r.proc.topupMin}: agregar ${r.proc.topupL} L de agua caliente si hace falta`}]);
  return [
    {t:"Limpiar y sanitizar",b:`Ollas 1, 2 y 3, fondo falso, funda de maceración, mangueras y las dos bombas. Purga las bombas antes de arrancar.`},
    {t:"Pesar los granos",b:r.granos.map(g=>`${g.n} <b>${gr(g.g)} g</b>`).join(" · ")+(r.notas?`<br><span style="color:var(--amber)">${esc(r.notas)}</span>`:"")},
    {t:"Calentar el agua de maceración",b:`Olla 1 con <b>${r.proc.macAgua} L</b>. Control 1 en <b>${DB.cfg.tempGolpe} °C</b> (temperatura de golpe) para caer en ${r.proc.macTemp} °C al empastar.`},
    {t:"Trasvasar al macerador",b:`Bomba 1 lleva el agua de Olla 1 a Olla 2. Fija el control 2 en <b>${r.proc.macTemp} °C</b> con banda de 1 °C.`},
    {t:"Empastar",b:`Funda sobre el fondo falso, agrega el grano poco a poco removiendo. Verifica que estabilice en ${r.proc.macTemp} °C.`},

  const total=l.etapas.reduce((a,e)=>a+e.d,0);
  let dia=Math.max(1,diasDesde(l.fecha));

  if(dia>total){fin=true; dentro=l.etapas[idx].d;}
  else for(let i=0;i<l.etapas.length;i++){
    const ini=acum+1, f=acum+l.etapas[i].d;
    if(dia>=ini && dia<=f){idx=i; dentro=dia-ini+1; break;}
    acum=f;
  }
  return {total,dia:Math.min(dia,total),idx,dentro,fin,pct:Math.min(100,Math.round(dia/total*100))};

/* ============================================================
   PLAN — reparto de las neveras en el tiempo
   Cada lote necesita fermentación + carbonación + maduración
   seguidas sin huecos: la cerveza nunca sale al ambiente.
   ============================================================ */
function diaAFecha(n){
  const d=new Date(DB.plan.inicio+"T00:00:00");
  d.setDate(d.getDate()+1+n);   // día 0 = entra al fermentador, un día después de la cocción
  return d;
}
const fFecha=d=>d.toLocaleDateString("es-EC",{day:"2-digit",month:"short"});
const fLargo=d=>d.toLocaleDateString("es-EC",{day:"2-digit",month:"short",year:"2-digit"});
function programar(){
  const P=DB.plan;
  const recetas=P.orden.map(id=>DB.recetas.find(r=>r.id===id)).filter(Boolean);
  const nev=Array.from({length:Math.max(1,P.neveras)},()=>[]);
  const fer=new Array(Math.max(1,P.fermentadores)).fill(0);
  const libre=(r,a,b)=>r.every(([x,y])=>b<=x||a>=y);
  const out=[]; let prev=-1;
  recetas.forEach(r=>{
    const mad=(r.madDias!=null?r.madDias:P.mad);
    const bloques=[P.fer,P.carb,mad];
    let s=prev+1;
    for(let guard=0; guard<4000; guard++, s++){
      if(!fer.some(f=>f<=s)) continue;
      const copia=nev.map(x=>x.slice()); let t=s, cabe=true;
      for(const d of bloques){
        const i=copia.findIndex(x=>libre(x,t,t+d));
        if(i<0){cabe=false;break;}
        copia[i].push([t,t+d]); t+=d;
      }
      if(!cabe) continue;
      let u=s; const tramos=[];
      bloques.forEach(d=>{ const i=nev.findIndex(x=>libre(x,u,u+d)); nev[i].push([u,u+d]); tramos.push({ini:u,fin:u+d,nevera:i+1}); u+=d; });
      fer[fer.findIndex(f=>f<=s)]=s+P.fer;
      out.push({r,s,mad,tramos,fin:u});
      prev=s; break;
    }
  });
  return out;
}
function edadMalta(diaIdx){
  const c=new Date(DB.plan.compraMaltas+"-15T00:00:00");
  return Math.round((diaAFecha(diaIdx)-c)/86400000/30.44);
}
function vPlan(){
  const P=DB.plan, prog=programar();
  if(!prog.length) return `<p class="eyebrow">Calendario</p><h1>Plan</h1><div class="empty">No hay recetas en el plan.</div>`;
  const hoy=hoy0(), d0=diaAFecha(0);
  const diaHoy=Math.floor((hoy-d0)/86400000);
  const fin=Math.max(...prog.map(p=>p.fin));
  const ultima=prog[prog.length-1];
  const vencidos=prog.filter(p=>edadMalta(p.s)>P.vidaMaltas).length;

  const ahora=[];
  prog.forEach(p=>{
    const nom=["Fermentación","Carbonatación 21–22 °C","Maduración 11–12 °C"];
    p.tramos.forEach((t,i)=>{ if(diaHoy>=t.ini && diaHoy<t.fin)
      ahora.push(`${p.r.nombre}: ${nom[i]}, día ${diaHoy-t.ini+1} de ${t.fin-t.ini} (nevera ${t.nevera})`); });
    if(diaHoy===p.s-1) ahora.push(`${p.r.nombre}: hoy es el Día 1 de cocción`);
  });
  const prox=prog.find(p=>p.s-1>diaHoy);

  return `
  <p class="eyebrow">Calendario</p>
  <h1>Plan de ${prog.length} lotes</h1>
  <p class="sub">${P.neveras} nevera${P.neveras>1?"s":""} · ${P.fermentadores} fermentador${P.fermentadores>1?"es":""} · ciclo ${Math.round((ultima.s-prog[0].s)/(prog.length-1))} días</p>

  <div class="card ${ahora.length?"hoy":""}">
    <p class="eyebrow" style="margin-bottom:6px">Hoy</p>
    ${ahora.length? `<div class="mini">${ahora.map(esc).join("<br>")}</div>`
      : `<div class="mini dim">${diaHoy<0?"El plan arranca el "+fLargo(diaAFecha(-1)):"Sin actividad programada."}</div>`}
    ${prox?`<div class="tiny dim" style="margin-top:8px">Próxima cocción: <b>${esc(prox.r.nombre)}</b> el ${fLargo(diaAFecha(prox.s-1))} (en ${prox.s-1-diaHoy} días)</div>`:""}
  </div>

  <div class="card">
    <div class="spread"><span class="tiny dim">ÚLTIMA COCCIÓN</span><span class="mini num">${fLargo(diaAFecha(ultima.s-1))}</span></div>
    <div class="spread" style="margin-top:4px"><span class="tiny dim">TODO CONSUMIBLE</span><span class="mini num">${fLargo(diaAFecha(fin+P.servir))}</span></div>
    <div class="spread" style="margin-top:4px"><span class="tiny dim">MALTA MÁS VIEJA</span>

function moverEnPlan(id,d){
  const o=DB.plan.orden, i=o.indexOf(id);
  if(i<0) return;
  const j=Math.max(0,Math.min(o.length-1,i+d));
  o.splice(j,0,o.splice(i,1)[0]);
  save(); render();
}

function guardarPlan(){
  const P=DB.plan, n=(id,def)=>{const v=parseInt($(id).value); return isNaN(v)?def:v;};
  P.inicio=$("#p_ini").value||P.inicio;
  P.neveras=Math.max(1,n("#p_nev",P.neveras)); P.fermentadores=Math.max(1,n("#p_fer",P.fermentadores));
  P.fer=n("#p_df",P.fer); P.carb=n("#p_dc",P.carb); P.mad=n("#p_dm",P.mad); P.servir=n("#p_ds",P.servir);
  P.compraMaltas=$("#p_cm").value.trim()||P.compraMaltas; P.vidaMaltas=n("#p_vm",P.vidaMaltas);
  P.compraLupulos=$("#p_cl").value.trim()||P.compraLupulos; P.vidaLupulos=n("#p_vl",P.vidaLupulos);
  P.compraLevadura=$("#p_cy").value.trim()||P.compraLevadura; P.vidaLevadura=n("#p_vy",P.vidaLevadura);
  save(); closeSheet(); render(); toast("Plan actualizado");
}

function sistema(){
  return `Eres el asistente cervecero de Edgar, cervecero casero en Guayaquil, Ecuador. Respondes en español, tuteando, directo y sin relleno.

REGLAS
1. La referencia de estilos es la Guía de Estilos BJCP (edición 2021 salvo que se indique otra). Cuando clasifiques una receta, da el código y nombre del estilo y los rangos del estilo (OG, FG, ABV, IBU, SRM/EBC) y compáralos punto por punto con los números de la receta, señalando lo que queda fuera de rango.
2. Razonas siempre sobre el equipo real descrito abajo, no sobre un equipo genérico. Si una sugerencia no es viable con 3 ollas (20/20/17 L), 2 bombas, control por relé y hervido partido en dos días, dilo.
3. No inventes cifras de alfa-ácidos, atenuación ni rendimiento. Si no las tienes, usa un rango típico y escribe entre paréntesis que es un supuesto, o pide el dato. Cuando algo sea un cálculo tuyo, muestra la fórmula y los números; cuando sea una suposición, dilo en la misma frase, sin etiquetas ni encabezados aparte.
4. La app ya calcula OG, FG, ABV, IBU (Tinseth) y color (Morey) de cada receta del plan, y ya calcula los saldos de insumos. Usa esos números tal cual; no los recalcules ni los contradigas. Si crees que un número de la app está mal, dilo explicando por qué, pero no lo reemplaces en silencio. Para una receta NUEVA que tú propongas, sí debes calcular, y entonces escribe la fórmula y los supuestos (alfa-ácidos, eficiencia ${DB.cfg.eficiencia} %, volumen, gravedad de hervido).
5. Antes de dar cualquier lista de cantidades, suma columna por columna y comprueba que el total cuadre con el dato de partida. Si no cuadra, corrígelo antes de responder. Nunca presentes una tabla cuyas sumas no den. Recuerda que el hervido está partido: ${DB.cfg.boil1} min el Día 1 y ${DB.cfg.boil2} min el Día 2, y una adición nominal de 60' recibe los dos tramos.
6. Sé concreto con cantidades, tiempos y temperaturas, en gramos, litros y grados Celsius. Cuando propongas una receta, respeta el stock disponible y avisa si no alcanza.
7. Si algo tiene riesgo sanitario o de seguridad (infección, sobrecarbonatación, botellas), dilo primero y sin rodeos.
8. Respuestas cortas por defecto (móvil). Amplía solo si te lo piden.
9. Entrega la respuesta final directamente. Nunca escribas tu plan, tu esquema, ni frases sobre lo que vas a presentar ("voy a mostrar…", "estructura de la respuesta"). Si la pregunta pide una receta, arranca con la receta.
10. No te contradigas con lo que dijiste antes en esta misma conversación. Antes de responder, revisa si algo que afirmaste choca con lo que vas a decir. Si cambias de opinión, dilo abiertamente ("antes te dije X, me corrijo") en vez de sostener las dos cosas.
11. Cuando digas que algo NO tiene un riesgo, sé especialmente cuidadoso: es donde más daño hace equivocarse. Los riesgos clásicos existen aunque el equipo del usuario los mitigue — nómbralos y explica por qué su equipo los reduce, nunca los niegues. Ejemplo: la avena, el trigo y el centeno sin maltear SÍ tienden a atascar el lauter por betaglucanos; la funda de maceración ayuda, pero no lo elimina.
12. Antes de recomendar cualquier cambio de lúpulo, calcula su efecto con Tinseth usando los parámetros de la app y di el número. Recuerda que un hervido de 10 min tiene una utilización muy baja: mover amargor al Día 2 exigiría más del doble de lúpulo. No propongas cambios cuyo costo no hayas cuantificado.
13. La comparación "coincide / no coincide" que muestra la app enfrenta lo calculado contra el objetivo anotado del usuario, NO contra el rango del estilo BJCP. Son dos comparaciones distintas: no las mezcles ni inventes un veredicto de la app. Si además quieres comentar el encaje con el estilo, hazlo aparte y dilo así.
14. No propongas cambios a una receta marcada como probada y aprobada salvo que el usuario lo pida. Si el usuario menciona un defecto, propón el cambio en otra receta del plan o avísale que estaría arriesgando un resultado que ya funciona.
15. Marca de dónde sale cada dato cuando importe: los del contexto son firmes; lo que venga de tu conocimiento general dilo así ("esto lo digo de memoria, verifícalo"). Ante una duda que no puedas resolver con el contexto, prefiere decir que no lo sabes o pedir el dato que falta antes que rellenar con algo plausible. El usuario tiene solo 20 consultas al día: una respuesta corta y honesta vale más que una larga e inventada.
16. Siempre que propongas o evalúes un cambio de receta, compara TODOS los parámetros afectados (OG, FG, ABV, IBU y color) contra el rango BJCP del estilo anotado y di expresamente cuáles quedan fuera y en qué se convertiría la cerveza. Una FG fuera de rango cuenta igual que un ABV fuera de rango. Un cambio que sube el alcohol por encima del techo del estilo no es un detalle menor: dilo.
17. Cuando un cambio suba la OG, la temperatura de fermentación o el estrés de la levadura, revisa el bloque de puntos de riesgo y menciona lo que aplique. En su clima, subir la densidad sin reforzar la siembra ni el control de temperatura es la vía directa a los alcoholes de fusel.
18. Al concentrar un mosto SUBEN las tres cosas: la densidad, el amargor y el color. Nunca digas que el amargor baja al concentrar. Ocurren dos efectos opuestos —el lúpulo queda en menos litros (sube el IBU) y la mayor densidad reduce la utilización (baja el IBU)— y el primero manda siempre; el neto es un aumento, pero menor que la razón de volúmenes. El color sube por una potencia (Morey), también menos que proporcional. Nunca multipliques por la razón de volúmenes ni restes por la caída de utilización: da el sentido correcto, márcalo como estimación y di que la app calcula el valor exacto al cambiar los litros de la receta.
19. CONSTANTES DE ESTE EQUIPO PARA CÁLCULO RÁPIDO (úsalas, no estimes):
   - Azúcar de mesa (sacarosa): 100 g en 16 L aportan 2,4 puntos de OG y unos +0,31 % de ABV, sin subir la FG. Para subir 1 punto porcentual de ABV en 16 L hacen falta unos 325 g. Calcula siempre la cantidad con esta constante y verifica el ABV resultante antes de darlo.
   - Evaporación: 1,85 L/h. Los minutos EXTRA de hervido son (litros a evaporar x 32,4). No confundas minutos extra con minutos totales: los totales son esos más los 55 habituales del Día 1.
   - Concentrar la Stout de 16 a 13 L, por ejemplo, deja OG ~1.067, unos 41 IBU y unos 75 EBC.
20. Para cualquier cambio de volumen por evaporación, usa la tasa real de este equipo: pasa de ${DB.cfg.vHervido} L a ${DB.cfg.vHervido-2} L en ${DB.cfg.boil1+DB.cfg.boil2} min de hervido, o sea unos 1,85 L/h. Calcula los minutos con esa tasa. Recuerda además que los 2 L de recarga del minuto 40 son opcionales: omitirlos ahorra casi una hora de hervido extra. Y avisa siempre cuántos litros de cerveza se pierden.
21. Cuidado con las dos numeraciones: cada receta tiene su número propio (#1 a #8) y el plan tiene un ORDEN DE ELABORACIÓN distinto. Di siempre el nombre de la receta y aclara a cuál de las dos numeraciones te refieres.
22. El usuario compra solo lo que va a usar: ya botó unos 40 kg de malta caducada. No le propongas insumos que no tenga sin advertirle la restricción de compra (las maltas especiales se venden por 5 kg mínimo, y le sobrarían). Lo que se consigue en supermercado, como los copos de avena, sí es viable en cualquier cantidad.

CONTEXTO ACTUAL
${contextoTexto()}`;
}
function vChat(){
  const ok=!!DB.cfg.apiKey, vacio=!DB.chat.length;
  return `<div id="chatwrap">
    <div id="chathead">

        <p class="sub">Conoce tu equipo, tus insumos, tus 8 recetas y el lote en curso. Responde según la guía BJCP.</p>`
        :`<div class="spread"><p class="eyebrow" style="margin:0">Chat cervecero</p>

            <button class="chip a" onclick="copiarTodo()">⧉ Copiar todo</button>
            <button class="chip" onclick="limpiarChat()">Limpiar</button>

      ${ok?"":`<div class="card" style="border-color:#4A3820;margin-top:8px"><div class="mini">Falta tu API key de Gemini.</div>
        <button class="btn sm" onclick="go('ajustes')">Ir a Ajustes</button></div>`}
      ${vacio?`<div class="qrow">
        ${["¿A qué estilo BJCP corresponde la receta 3?","Si muevo los 8 g de Simcoe del minuto 20 al 60, ¿cuánto sube el IBU?","Con lo que me sobra de stock, propóneme una receta","¿Es riesgoso partir el hervido en dos días?","¿Qué reviso hoy en el lote en curso?"]
          .map(q=>`<button class="qbtn" onclick="usarSugerencia(${JSON.stringify(q).replace(/"/g,"&quot;")})">${esc(q)}</button>`).join("")}

function limpiarChat(){
  if(!confirm("¿Borrar la conversación?")) return;
  DB.chat=[]; save(); render();
}
function autosize(el){el.style.height="auto";el.style.height=Math.min(120,el.scrollHeight)+"px";}
function usarSugerencia(q){ $("#chatin").value=q; autosize($("#chatin")); $("#chatin").focus(); }
function pintarChat(){
  const m=$("#msgs"); if(!m) return;
  m.innerHTML = DB.chat.length? DB.chat.map((x,i)=>x.r==="u"
    ? `<div class="msg u">${esc(x.t)}</div>`
    : `<div class="msg a"><pre>${fmt(x.t)}</pre><button class="copy" onclick="copiarPar(${i})">⧉ Copiar</button></div>`).join("")
    : `<div class="empty">Pregúntale lo que quieras sobre tu proceso, tus recetas o el estilo BJCP.</div>`;
  m.scrollTop=m.scrollHeight;
}
function abajo(){ const m=$("#msgs"); if(m) m.scrollTop=m.scrollHeight; }
function fmt(t){
  return esc(t)
    .replace(/^\s{0,6}#{1,6}\s*(.+)$/gm,"<b>$1</b>")
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/^\s{0,8}[\*\-\u2022]\s+/gm,"• ")
    .replace(/\*/g,"");
}
function copiarTodo(){
  if(!DB.chat.length) return toast("No hay conversación que copiar");
  const txt="CHAT CERVECERO — "+ahoraEC()+"\n\n"+
    DB.chat.map(m=>(m.r==="u"?"PREGUNTA:\n":"RESPUESTA:\n")+m.t).join("\n\n")+"\n";
  navigator.clipboard.writeText(txt)
    .then(()=>toast(DB.chat.length+" mensajes copiados"))
    .catch(()=>toast("No se pudo copiar"));
}
function copiarPar(i){
  let q=""; for(let k=i-1;k>=0;k--){ if(DB.chat[k].r==="u"){q=DB.chat[k].t;break;} }
  const txt=(q?"PREGUNTA:\n"+q+"\n\n":"")+"RESPUESTA:\n"+DB.chat[i].t;
  navigator.clipboard.writeText(txt).then(()=>toast("Copiado")).catch(()=>toast("No se pudo copiar"));
}
function preguntarSobre(id){
  const r=DB.recetas.find(x=>x.id===id);
  go("chat"); setTimeout(()=>usarSugerencia(`Sobre la receta "${r.nombre}": `),50);
}
function preguntarLote(id){
  const l=DB.lotes.find(x=>x.id===id);
  go("chat"); setTimeout(()=>usarSugerencia(`Sobre el lote ${l.numero} (${l.nombre}): `),50);
}
function pedirRecetaIA(){
  go("chat"); setTimeout(()=>usarSugerencia("Con el stock que me queda, propóneme una receta de 16 L. Quiero que sea "),50);
}
let cargando=false;
/* Los modelos con razonamiento devuelven partes marcadas thought:true.
   Se descartan: son el borrador interno, no la respuesta. */
async function llamarGemini(gen){
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(DB.cfg.model)}:generateContent?key=${encodeURIComponent(DB.cfg.apiKey)}`;
  const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    systemInstruction:{parts:[{text:sistema()}]},
    contents:DB.chat.map(x=>({role:x.r==="u"?"user":"model",parts:[{text:x.t}]})),
    generationConfig:gen
  })});
  const data=await res.json().catch(()=>({}));
  return {ok:res.ok, status:res.status, data:data};
}
async function enviar(){
  const el=$("#chatin"), txt=el.value.trim();
  if(!txt||cargando) return;
  if(!DB.cfg.apiKey){ toast("Falta la API key en Ajustes"); return; }
  el.value=""; autosize(el);
  DB.chat.push({r:"u",t:txt}); save();
  /* Con el primer mensaje la cabecera cambia (aparecen Copiar todo y
     Limpiar), así que hay que rehacer la vista, no solo los mensajes. */
  if(DB.chat.length===1) render(); else pintarChat();
  cargando=true;
  $("#msgs").insertAdjacentHTML("beforeend",`<div class="msg a" id="cargando">
    <div class="pensando">
      <svg class="vaso" viewBox="0 0 26 34" aria-hidden="true">
        <path class="v-cuerpo" d="M4 4 h18 l-2 26 a2 2 0 0 1 -2 2 h-10 a2 2 0 0 1 -2 -2 z"/>
        <clipPath id="cp"><path d="M5 12 h16 l-1.8 18 a2 2 0 0 1 -2 2 h-8.4 a2 2 0 0 1 -2 -2 z"/></clipPath>
        <g clip-path="url(#cp)">
          <rect class="v-liquido" x="5" y="12" width="16" height="20"/>
          <circle class="burbuja b1" cx="9"  cy="30" r="1.5"/>
          <circle class="burbuja b2" cx="13" cy="30" r="1.1"/>
          <circle class="burbuja b3" cx="17" cy="30" r="1.7"/>
          <circle class="burbuja b4" cx="11" cy="30" r="1.2"/>
        </g>
        <ellipse class="v-espuma" cx="13" cy="11" rx="9" ry="3.4"/>
      </svg>
      <span class="dim">Pensando…</span>
    </div></div>`);
  abajo();

  const base={temperature:0.6,maxOutputTokens:6144};
  const intentos=[
    Object.assign({},base,{thinkingConfig:{thinkingLevel:"low",includeThoughts:false}}),
    Object.assign({},base,{thinkingConfig:{thinkingBudget:512,includeThoughts:false}}),
    base
  ];
  let r=null;
  try{
    for(let i=0;i<intentos.length;i++){
      r=await llamarGemini(intentos[i]);
      if(r.ok) break;
      const msg=(r.data.error&&r.data.error.message)||"";
      const campoDesconocido = r.status===400 && /thinking|unknown name|Invalid JSON payload/i.test(msg);
      if(!campoDesconocido) break;
    }
    if(!r.ok) throw new Error((r.data.error&&r.data.error.message)||("Error "+r.status));

    const cand=(r.data.candidates||[])[0]||{};
    const partes=((cand.content||{}).parts)||[];
    const out=partes.filter(p=>!p.thought && typeof p.text==="string").map(p=>p.text).join("").trim();
    if(out) DB.chat.push({r:"a",t:out});
    else if(cand.finishReason==="MAX_TOKENS")
      DB.chat.push({r:"a",t:"El modelo se quedó sin espacio antes de escribir la respuesta (gastó el presupuesto pensando). Vuelve a preguntar de forma más concreta, o baja el tamaño de la pregunta."});
    else if(cand.finishReason && cand.finishReason!=="STOP")
      DB.chat.push({r:"a",t:"La respuesta se detuvo ("+cand.finishReason+"). Reformula la pregunta."});
    else
      DB.chat.push({r:"a",t:"La respuesta llegó vacía. Revisa el nombre del modelo en Ajustes."});
  }catch(e){
    DB.chat.push({r:"a",t:"No se pudo consultar a Gemini: "+e.message+"\n\nRevisa la API key, el nombre del modelo en Ajustes y tu conexión."});
  }
  cargando=false; save(); pintarChat();
}

function guardarCfg(){
  DB.cfg.apiKey=$("#a_key").value.trim();
  DB.cfg.model=$("#a_mod").value.trim()||"gemini-3.6-flash";
  DB.cfg.boil1=parseInt($("#a_b1").value)||55;
  DB.cfg.boil2=parseInt($("#a_b2").value)||10;
  DB.cfg.tempGolpe=$("#a_tg").value.trim()||"72–74";
  save(); toast("Ajustes guardados"); render();
}
function guardarCalc(){
  const ef=parseFloat($("#a_ef").value), vh=parseFloat($("#a_vh").value), wp=parseFloat($("#a_wp").value);
  if(!isNaN(ef)) DB.cfg.eficiencia=ef;
  if(!isNaN(vh)) DB.cfg.vHervido=vh;
  if(!isNaN(wp)) DB.cfg.factorWP=wp/100;
  save(); toast("Parámetros guardados"); render();
}
function aplicarPlan(){
  if(!confirm("Repone las 8 recetas pendientes con el plan balanceado: granos, lúpulos, volumen, nombre y objetivos. ¿Seguir?")) return;
  const base=seed().recetas; let n=0;
  base.forEach(b=>{
    const i=DB.recetas.findIndex(x=>x.n===b.n && x.estado==="pendiente");
    if(i<0) return;
    const id=DB.recetas[i].id;
    DB.recetas[i]=Object.assign(JSON.parse(JSON.stringify(b)),{id:id,estado:"pendiente"});
    n++;
  });
  save(); toast(n+" recetas repuestas"); go("recetas");
}
function exportar(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`cerveceria_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}
function importar(ev){
  const f=ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.recetas) throw new Error("archivo sin recetas");
      DB=d; if(!DB.log) DB.log=CAMBIOS.slice();
      save(); go("recetas"); toast("Datos importados");
    }catch(err){ toast("Archivo inválido: "+err.message,3500); }
    ev.target.value="";
  };
  rd.readAsText(f);
}
function reset(){
  if(!confirm("Esto borra lotes, chat y cambios de receta. ¿Continuar?")) return;
  DB=seed(); save(); go("recetas"); toast("Datos de fábrica restaurados");
}
function openLog(){
  sheet("Registro de cambios", DB.log.map(c=>
    `<div style="padding:8px 0;border-top:1px solid var(--line)">
      <div class="tiny num" style="color:var(--amber)">${esc(c.f)}</div>
      <div class="mini muted">${esc(c.t)}</div></div>`).join("")
    +`<button class="btn sec sm" onclick="closeSheet()">Cerrar</button>`);
}

/* ---------- Sheet ---------- */
function sheet(titulo,html){
  const d=document.createElement("div");
  d.className="modal"; d.id="sheet";
  d.innerHTML=`<div class="sheet"><div class="grab"></div><h2 style="margin-bottom:2px">${esc(titulo)}</h2>${html}</div>`;
  d.addEventListener("click",e=>{ if(e.target===d) closeSheet(); });
  document.body.appendChild(d);
}
function closeSheet(){ const s=$("#sheet"); if(s) s.remove(); }

/* ---------- Arranque ---------- */
go("lotes");
</script>
